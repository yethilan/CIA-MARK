<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamil — Internal Marks Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --brand-main: #e53935;
  --brand-main-hover: #d32f2f;
  --brand-gradient: linear-gradient(135deg, #e53935 0%, #c62828 100%);
  --active-text: var(--brand-main);
  --bg-body: #f5f6fa; --bg-panel: #ffffff; --bg-sidebar: #ffffff;
  --text-main: #0f172a; --text-muted: #64748b; --text-soft: #94a3b8;
  --border-color: #e8ebf2; --border-strong: #d4dae5; --hover-bg: #f2f4f8;
  --active-bg: color-mix(in srgb, var(--brand-main) 10%, transparent);
  --ok: #16a34a;   --ok-bg: #e7f7ee;
  --bad: #dc2626;  --bad-bg: #fdecec;
  --warn: #ea580c; --warn-bg: #fff2e6;
  --blue: #2563eb; --blue-bg: #e9f0fe;
  --purple: #7c3aed; --purple-bg: #f3ebff;
  --card-radius: 18px; --btn-radius: 12px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
  --shadow-md: 0 10px 30px -12px rgba(15,23,42,0.18), 0 3px 10px rgba(15,23,42,0.04);
  --shadow-lg: 0 24px 60px -20px rgba(15,23,42,0.28);
  --shadow-brand: 0 10px 24px -10px color-mix(in srgb, var(--brand-main) 55%, transparent);
  --ring: 0 0 0 4px color-mix(in srgb, var(--brand-main) 18%, transparent);
}
[data-theme="dark"] {
  --bg-body: #0a0e17; --bg-panel: #111827; --bg-sidebar: #0d131f;
  --text-main: #e5ecf5; --text-muted: #94a3b8; --text-soft: #64748b;
  --border-color: #1e293b; --border-strong: #2b3a4f; --hover-bg: #1a2334;
  --active-bg: color-mix(in srgb, var(--brand-main) 20%, transparent);
  --ok: #4ade80; --ok-bg: rgba(74,222,128,0.14);
  --bad: #f87171; --bad-bg: rgba(248,113,113,0.14);
  --warn: #fb923c; --warn-bg: rgba(251,146,60,0.14);
  --blue: #60a5fa; --blue-bg: rgba(96,165,250,0.14);
  --purple: #a78bfa; --purple-bg: rgba(167,139,250,0.14);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 12px 30px -12px rgba(0,0,0,0.7);
  --shadow-lg: 0 30px 70px -20px rgba(0,0,0,0.85);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: 'Inter', 'Noto Sans Tamil', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-body); color: var(--text-main); font-size: 14px; line-height: 1.55; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; transition: background-color 0.3s, color 0.3s; }
h1,h2,h3,h4,h5 { font-family: 'Outfit', 'Inter', sans-serif; letter-spacing: -0.02em; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; border: 2px solid var(--bg-body); }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

.login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow: hidden;
  background: radial-gradient(circle at 12% 18%, color-mix(in srgb, var(--brand-main) 26%, transparent) 0%, transparent 42%), radial-gradient(circle at 88% 8%, color-mix(in srgb, #6366f1 22%, transparent) 0%, transparent 40%), radial-gradient(circle at 82% 92%, color-mix(in srgb, #f59e0b 18%, transparent) 0%, transparent 45%), var(--bg-body); }
.login-card { position: relative; background: color-mix(in srgb, var(--bg-panel) 82%, transparent); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border: 1px solid color-mix(in srgb, var(--border-color) 60%, transparent); border-radius: 28px; padding: 46px 40px 36px; width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes cardIn { from { opacity: 0; transform: translateY(22px) scale(0.97); } to { opacity: 1; transform: none; } }
.login-logo { text-align: center; font-family: 'Outfit', sans-serif; font-size: 42px; font-weight: 800; letter-spacing: 4px; background: linear-gradient(135deg, var(--brand-main), color-mix(in srgb, var(--brand-main) 40%, #ff8a8a)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; line-height: 1.05; }
.login-subtitle { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 30px; }
.login-card input { width: 100%; padding: 14px 16px; margin-bottom: 14px; border: 1px solid var(--border-color); border-radius: 14px; font-size: 14px; font-family: inherit; background: var(--bg-body); color: var(--text-main); transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; }
.login-card input:focus { outline: none; border-color: var(--brand-main); background: var(--bg-panel); box-shadow: var(--ring); }
.login-btn { width: 100%; padding: 14px; background: var(--brand-gradient); color: #fff; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-brand); transition: transform 0.15s, filter 0.2s; font-family: inherit; }
.login-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.login-error { color: var(--bad); font-size: 13px; text-align: center; margin-bottom: 10px; display: none; font-weight: 600; }
.password-wrapper { position: relative; }
.toggle-password { position: absolute; right: 14px; top: 14px; cursor: pointer; font-size: 16px; color: var(--text-muted); }

.app-container { display: none; flex-direction: column; height: 100vh; }
.topbar { height: 64px; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; z-index: 100; position: relative; background: var(--brand-gradient); box-shadow: 0 6px 24px -10px color-mix(in srgb, var(--brand-main) 60%, transparent); }
.topbar-left { display: flex; align-items: center; gap: 18px; }
.hamburger { display: none; font-size: 22px; cursor: pointer; width: 38px; height: 38px; border-radius: 11px; align-items: center; justify-content: center; }
.hamburger:hover { background: rgba(255,255,255,0.16); }
.topbar-logo { font-family: 'Outfit', sans-serif; font-size: 21px; font-weight: 800; letter-spacing: 1.5px; display: flex; align-items: center; gap: 10px; }
.topbar-logo-icon { background: #fff; color: var(--brand-main); width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; font-weight: 800; box-shadow: 0 6px 16px -6px rgba(0,0,0,0.35); }
.topbar-search { position: relative; width: 320px; z-index: 110; }
.topbar-search input { width: 100%; padding: 10px 14px 10px 40px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.18); color: #fff; font-size: 13px; font-family: inherit; outline: none; transition: background 0.2s; }
.topbar-search input::placeholder { color: rgba(255,255,255,0.78); }
.topbar-search input:focus { background: rgba(255,255,255,0.28); border-color: rgba(255,255,255,0.45); }
.topbar-search .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.8); font-size: 13px; pointer-events: none; }
.topbar-search-results { position: absolute; top: 48px; left: 0; width: 340px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow-lg); max-height: 340px; overflow-y: auto; display: none; z-index: 200; padding: 6px; }
.topbar-search-results.show { display: block; animation: popIn 0.18s ease; }
@keyframes popIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.topbar-search-results div { padding: 10px 12px; cursor: pointer; border-radius: 10px; color: var(--text-main); transition: background 0.15s; }
.topbar-search-results div:hover { background: var(--hover-bg); }
.topbar-right { display: flex; align-items: center; gap: 6px; }
.top-icon { font-size: 18px; cursor: pointer; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; transition: background 0.18s, transform 0.18s; }
.top-icon:hover { background: rgba(255,255,255,0.16); transform: scale(1.05); }
.top-avatar { width: 38px; height: 38px; border-radius: 50%; background: #fff; object-fit: cover; border: 2px solid rgba(255,255,255,0.55); cursor: pointer; margin-left: 4px; }

.layout-body { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 262px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); overflow-y: auto; display: flex; flex-direction: column; padding: 14px 0; transition: transform 0.25s ease; }
.nav-section { padding: 16px 24px 8px; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.4px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 16px; margin: 2px 12px; cursor: pointer; color: var(--text-main); font-weight: 500; border-radius: 12px; transition: all 0.18s ease; font-size: 13.5px; position: relative; }
.nav-item:hover { background-color: var(--hover-bg); }
.nav-item.active { background-color: var(--active-bg); color: var(--active-text); font-weight: 700; }
.nav-item.active::before { content: ''; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand-main); }
.nav-icon { font-size: 18px; width: 24px; text-align: center; display: grid; place-items: center; }
.sidebar-bottom { margin-top: auto; border-top: 1px solid var(--border-color); padding: 12px 0 4px; }
.user-profile-small { display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin: 0 12px; border-radius: 14px; background: var(--hover-bg); }
.user-profile-small img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
.user-profile-small .info { display: flex; flex-direction: column; min-width: 0; }
.user-profile-small .name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-profile-small .role { font-size: 11px; color: var(--text-muted); text-transform: capitalize; }

.main-content { flex: 1; padding: 26px 32px 40px; overflow-y: auto; background: var(--bg-body); }
.page-header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.page-title { font-size: 26px; font-weight: 800; margin: 0; color: var(--text-main); letter-spacing: -0.03em; }
.page-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.view { animation: viewFade 0.35s ease; }
@keyframes viewFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: var(--card-radius); padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow-sm); transition: box-shadow 0.25s, border-color 0.25s; }
.card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
.card-title { font-size: 16px; font-weight: 700; margin: 0; color: var(--text-main); display: flex; align-items: center; gap: 8px; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 20px; }
.kpi-box { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: var(--card-radius); padding: 20px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.25s; }
.kpi-box:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.kpi-icon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
.kpi-icon.blue { background: var(--blue-bg); color: var(--blue); }
.kpi-icon.green { background: var(--ok-bg); color: var(--ok); }
.kpi-icon.red { background: var(--bad-bg); color: var(--bad); }
.kpi-icon.orange { background: var(--warn-bg); color: var(--warn); }
.kpi-icon.purple { background: var(--purple-bg); color: var(--purple); }
.kpi-info .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.6px; }
.kpi-info .value { font-size: 24px; font-weight: 800; color: var(--text-main); font-family: 'Outfit', sans-serif; }
.kpi-info .value small { font-size: 0.6em; color: var(--text-muted); font-weight: 600; }

input[type="text"], input[type="number"], input[type="password"], input[type="date"], select, textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: min(var(--btn-radius), 16px); background: var(--bg-panel); color: var(--text-main); font-size: 13.5px; font-family: inherit; transition: border-color 0.18s, box-shadow 0.18s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand-main); box-shadow: var(--ring); }

.btn { padding: 10px 18px; border: 1px solid transparent; border-radius: var(--btn-radius); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.18s ease; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-family: inherit; white-space: nowrap; }
.btn-primary { background: var(--brand-gradient); color: #fff; box-shadow: var(--shadow-brand); }
.btn-primary:hover { filter: brightness(1.07); transform: translateY(-1px); }
.btn-outline { background: var(--bg-panel); border-color: var(--border-color); color: var(--text-main); }
.btn-outline:hover { background: var(--hover-bg); border-color: var(--border-strong); }
.btn-danger { background: var(--bad-bg); color: var(--bad); border: 1px solid transparent; }
.btn-danger:hover { background: color-mix(in srgb, var(--bad) 18%, transparent); }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; border: none; }
.btn-whatsapp:hover { filter: brightness(1.05); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.table-wrap { overflow-x: auto; overflow-y: auto; max-height: 65vh; border-radius: 14px; border: 1px solid var(--border-color); background: var(--bg-panel); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 13px 16px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 13px; }
th { background: var(--bg-panel); position: sticky; top: 0; z-index: 10; color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.8px; box-shadow: 0 1px 0 var(--border-color); }
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background 0.15s; }
tbody tr:hover td { background: var(--hover-bg); }
.num { font-variant-numeric: tabular-nums; }

.entry-tbl { border: none; }
.entry-tbl input[type="text"] { padding: 8px 10px; font-size: 14px; text-align: center; font-weight: 700; width: 92px; border-radius: 10px; border: 1px solid var(--border-color); }
.entry-tbl input.empty { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.entry-tbl input.invalid-mark { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); animation: shake 0.25s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
.entry-tbl input:disabled { background: var(--hover-bg); cursor: not-allowed; opacity: 0.7; }
.entry-tbl td.conv-cell { font-weight: 800; color: var(--brand-main); text-align: center; }
.entry-tbl td.total-cell { font-weight: 800; color: var(--text-main); text-align: center; background: var(--hover-bg); }
.entry-tbl tr.filled td:first-child { box-shadow: inset 3px 0 0 var(--ok); }
.ab-label { font-size: 11px; color: var(--bad); font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; margin-top: 6px; }
.ab-label input { width: auto; margin: 0; cursor: pointer; }

.tabs { display: flex; gap: 4px; padding: 5px; background: var(--hover-bg); border: 1px solid var(--border-color); border-radius: 14px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 9px 16px; cursor: pointer; font-weight: 600; color: var(--text-muted); border-radius: 10px; white-space: nowrap; transition: all 0.18s; display: flex; align-items: center; gap: 6px; font-size: 13px; }
.tab:hover { color: var(--text-main); background: color-mix(in srgb, var(--bg-panel) 55%, transparent); }
.tab.active { color: var(--brand-main); background: var(--bg-panel); box-shadow: var(--shadow-sm); font-weight: 700; }

.badge { padding: 4px 11px; border-radius: 999px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; letter-spacing: 0.2px; }
.badge-pass { background: var(--ok-bg); color: var(--ok); }
.badge-fail { background: var(--bad-bg); color: var(--bad); }
.badge-abs  { background: var(--hover-bg); color: var(--text-muted); }
.badge-incomplete { background: var(--warn-bg); color: var(--warn); }

.chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-top: 10px; }
.chart-box { border: 1px solid var(--border-color); border-radius: 16px; padding: 18px; background: var(--bg-panel); }
.chart-title { font-weight: 700; font-size: 13px; margin-bottom: 10px; color: var(--text-main); }
.chart-svg { width: 100%; height: auto; display: block; }

.hint { font-size: 12px; color: var(--text-muted); }
.text-green { color: var(--ok); }
.text-red   { color: var(--bad); }
.text-warn  { color: var(--warn); }
.mt-2 { margin-top: 10px; }
.mb-2 { margin-bottom: 10px; }
.divider { height: 1px; background: var(--border-color); margin: 18px 0; }

.color-presets { display: flex; gap: 10px; flex-wrap: wrap; }
.color-btn { width: 38px; height: 38px; border-radius: 12px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
.color-btn:hover { transform: scale(1.08); }
.color-btn.active { border-color: var(--text-main); box-shadow: 0 0 0 2px var(--bg-panel) inset; }
.shape-presets { display: flex; gap: 10px; flex-wrap: wrap; }
.shape-btn { padding: 8px 18px; border: 1px solid var(--border-color); cursor: pointer; background: var(--bg-panel); font-weight: 600; font-size: 12px; transition: 0.2s; font-family: inherit; color: var(--text-main); }
.shape-btn.active { border-color: var(--brand-main); color: var(--brand-main); background: var(--active-bg); }

.band-tbl input { padding: 6px; text-align: center; }
.preview-tbl tr.ok td  { background: color-mix(in srgb, var(--ok) 10%, transparent); }
.preview-tbl tr.err td { background: color-mix(in srgb, var(--bad) 10%, transparent); }
.preview-tbl tr.warn td { background: color-mix(in srgb, var(--warn) 10%, transparent); }

.search-bar-container { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.search-bar-container input { flex: 1; padding: 11px 18px; border-radius: 999px; border: 1px solid var(--border-color); background: var(--bg-body); }
.clear-search { cursor: pointer; font-size: 18px; color: var(--text-muted); padding: 5px; }
.clear-search:hover { color: var(--bad); }

.empty-state { text-align: center; padding: 48px 24px; border-radius: var(--card-radius); background: var(--bg-panel); border: 1px dashed var(--border-strong); }
.empty-state .emoji { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.8; }
.empty-state h3 { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
.empty-state p { color: var(--text-muted); margin: 0 0 18px; font-size: 13px; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 900; display: none; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.2s ease; }
.modal-backdrop.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 22px; box-shadow: var(--shadow-lg); width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: none; } }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background: var(--bg-panel); z-index: 2; }
.modal-title { margin: 0; font-size: 18px; font-weight: 700; }
.modal-close { cursor: pointer; font-size: 22px; color: var(--text-muted); width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; }
.modal-close:hover { background: var(--hover-bg); color: var(--text-main); }
.modal-body { padding: 24px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); background: var(--text-main); color: var(--bg-panel); padding: 12px 20px; border-radius: 14px; z-index: 9999; font-weight: 600; box-shadow: var(--shadow-lg); font-family: 'Inter', sans-serif; font-size: 13px; transition: opacity 0.3s, bottom 0.25s; max-width: 90vw; display: flex; align-items: center; gap: 10px; border-left: 3px solid var(--brand-main); }
.toast-enter { animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }

.activity-list { display: flex; flex-direction: column; gap: 8px; }
.activity-item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--bg-body); border: 1px solid transparent; transition: border-color 0.15s; }
.activity-item:hover { border-color: var(--border-color); }
.activity-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--active-bg); color: var(--brand-main); font-size: 15px; flex-shrink: 0; }
.activity-body { flex: 1; min-width: 0; }
.activity-action { font-weight: 700; font-size: 12.5px; }
.activity-meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

.quick-toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: var(--hover-bg); border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.quick-toolbar .hint { margin-left: auto; }

.print-form { font-family: Arial, sans-serif; color: #000; background: #fff; padding: 20px; border-radius: 12px; }
[data-theme="dark"] .print-form { box-shadow: 0 0 0 1px var(--border-strong), var(--shadow-md); }
.print-form h2 { text-align:center; text-transform:uppercase; letter-spacing:1px; margin-bottom:5px; font-size:18px; color:#000; }
.print-form h3 { text-align:center; margin-top:0; font-size:14px; font-weight:normal; margin-bottom:20px; color:#000; }
.print-form table { width:100%; border-collapse:collapse; margin-bottom:20px; }
.print-form th, .print-form td { border:1px solid #000; padding:6px; text-align:center; font-size:12px; color:#000; background:transparent; }
.print-form th { background:#f0f0f0; font-weight:bold; }
.print-form .text-left { text-align:left; }

.screen-only { display: block; }
.print-only  { display: none; }

@media (max-width: 900px) {
  .analytics-grid { grid-template-columns: 1fr !important; }
}

@media print {
  body { background: #fff; }
  .sidebar, .topbar, .btn, .tabs, .no-print, .page-header, select, .print-header-actions, .modal-backdrop { display: none !important; }
  .screen-only { display: none !important; }
  .print-only  { display: block !important; }
  .layout-body { display: block; }
  .main-content { padding: 0; overflow: visible; }
  .card { border: none; box-shadow: none; padding: 0; margin: 0; background: transparent; }
  .print-form { padding: 0; border-radius: 0; box-shadow: none; }
  .view { animation: none; }
}

.sidebar-backdrop { display: none; position: fixed; inset: 64px 0 0 0; background: rgba(0,0,0,0.4); z-index: 85; backdrop-filter: blur(2px); }
@media (max-width: 860px) {
  .hamburger { display: flex; }
  .sidebar { position: fixed; inset: 64px auto 0 0; transform: translateX(-100%); z-index: 90; box-shadow: var(--shadow-lg); width: 280px; }
  .sidebar.open { transform: none; }
  .sidebar.open ~ .sidebar-backdrop, .sidebar-backdrop.show { display: block; }
  .topbar-search { display: none; }
  .topbar { padding: 0 14px; }
  .topbar-logo { font-size: 18px; }
  .topbar-logo-icon { width: 32px; height: 32px; font-size: 17px; }
  .main-content { padding: 16px; }
  .page-title { font-size: 22px; }
  .page-header { gap: 10px; }
  .page-header select { width: 100% !important; }
  .login-card { padding: 32px 24px; }
  .kpi-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi-box { padding: 14px; gap: 10px; }
  .kpi-icon { width: 42px; height: 42px; font-size: 18px; border-radius: 12px; }
  .kpi-info .value { font-size: 20px; }
  .card { padding: 16px; }
  th, td { padding: 10px 12px; font-size: 12px; }
  .btn { padding: 9px 14px; font-size: 12.5px; }
  .modal-body { padding: 18px; }
}
@media (max-width: 420px) { .kpi-grid { grid-template-columns: 1fr; } }
[data-btn-shape="pill"] .btn { padding-left: 24px; padding-right: 24px; }
[data-btn-shape="pill"] .nav-item { border-radius: 999px; }
[data-btn-shape="pill"] .tab { border-radius: 999px; }
:focus-visible { outline: 2px solid var(--brand-main); outline-offset: 2px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">TAMIL</div>
    <div class="login-subtitle">Internal Marks Manager</div>
    <form onsubmit="event.preventDefault(); attemptLogin();">
      <input id="loginUser" type="text" placeholder="Username" autocomplete="username" oninput="document.getElementById('loginError').style.display='none'">
      <div class="password-wrapper">
        <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" oninput="document.getElementById('loginError').style.display='none'">
        <span class="toggle-password" onclick="togglePasswordVisibility()">👁️</span>
      </div>
      <div id="loginError" class="login-error"></div>

</div>

<div id="appScreen" class="app-container">
  <header class="topbar">
    <div class="topbar-left">
      <div class="hamburger" onclick="toggleMobileSidebar()" title="Menu">☰</div>
      <div class="topbar-logo"><div class="topbar-logo-icon">T</div> Tamil</div>
      <div class="topbar-search">
        <span class="search-icon">🔍</span>
        <input type="text" id="globalSearch" placeholder="Search student by name or reg no..." oninput="handleGlobalSearch(this.value)">

  <div class="layout-body">

<script>
/* =========================================================
   CONSTANTS
   ========================================================= */
const SCHEME = {
  I: { label: '1st Year', comps: [
    { key:'cia1', label:'1st CIA', rawMax:60, max:15, conv:true },
    { key:'cia2', label:'2nd CIA', rawMax:60, max:15, conv:true },
    { key:'sem', label:'Seminar', rawMax:5, max:5, conv:false },
    { key:'asg', label:'Assignment', rawMax:5, max:5, conv:false }
  ]},
  II: { label: '2nd Year', comps: [
    { key:'cia1', label:'Test I', rawMax:60, max:12.5, conv:true },
    { key:'att', label:'Attendance', rawMax:5, max:5, conv:false },
    { key:'cia2', label:'Test II', rawMax:60, max:12.5, conv:true },
    { key:'sem', label:'Seminar', rawMax:5, max:5, conv:false },
    { key:'asg', label:'Assignment', rawMax:5, max:5, conv:false }
  ]}
};
const DEFAULT_INTERNAL_MAX = 40;
function getInternalMax(c) {
  const comps = getClassComps(c);
  const sum = comps.reduce((acc, cp) => acc + Number(cp.max || 0), 0);
  return sum > 0 ? sum : DEFAULT_INTERNAL_MAX;
}
const DEFAULT_BANDS = [
  { min:90, max:100, val:90 }, { min:80, max:89.99, val:80 }, { min:70, max:79.99, val:70 },
  { min:60, max:69.99, val:60 }, { min:50, max:59.99, val:50 }, { min:40, max:49.99, val:40 },
  { min:0, max:39.99, val:0 }
];

/* =========================================================
   AUTH & STATE
   ========================================================= */
const USERS_KEY = 'tamil_users_v10';
const SESSION_KEY = 'tamil_session';
const STORE_KEY = 'tamil_data_v10';
const DEFAULT_USERS = [{ username: 'admin', password: 'admin123', role: 'admin' }];

function seedUsers() {
  try {
    const existing = JSON.parse(localStorage.getItem(USERS_KEY));
    if (!existing || !Array.isArray(existing) || existing.length === 0) localStorage.setItem(USERS_KEY, JSON.stringify(DEFAULT_USERS));
  } catch(e) { localStorage.setItem(USERS_KEY, JSON.stringify(DEFAULT_USERS)); }
}
function getUsers() {
  try {
    const users = JSON.parse(localStorage.getItem(USERS_KEY));
    if (!users || !Array.isArray(users) || users.length === 0) return DEFAULT_USERS;
    return users;
  } catch(e) { return DEFAULT_USERS; }
}
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function getSession() { try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch(e) { return null; } }
function isAdmin() { const s = getSession(); return s && s.role === 'admin'; }
function currentUser() { const s = getSession(); if(!s) return null; return getUsers().find(u => u.username === s.username) || null; }

const state = {
  roundMode: '2', classes: [], activeClassId: null, activeComp: null, expandedClassId: null,
  bulkClassId: null, printType: 'comp:cia1', statsComp: null, dashboardPassComp: 'overall',
  dashboardShowFailed: false, view: 'dashboard', theme: 'light', chartType: 'bar',
  testAnalysisDate: '', testAnalysisTime: '', testAnalysisT1: 'cia1', testAnalysisT2: 'cia2',
  searchQuery: '', meritSort: 'rank', meritSearch: '', auditLog: [],
  ui: { brandColor: '#e53935', btnRadius: '12px', cardRadius: '18px' },
  settings: { bandsEnabled: true, passPercent: 50, bands: DEFAULT_BANDS.map(b=>({...b})) }
};

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(s && Array.isArray(s.classes)) {
      state.classes = s.classes;
      ['roundMode','activeClassId','activeComp','printType','statsComp','dashboardPassComp','dashboardShowFailed','theme','chartType','testAnalysisDate','testAnalysisTime','testAnalysisT1','testAnalysisT2','meritSort'].forEach(k => { if (s[k] !== undefined) state[k] = s[k]; });
      state.auditLog = Array.isArray(s.auditLog) ? s.auditLog : [];
      state.ui = Object.assign({ brandColor: '#e53935', btnRadius: '12px', cardRadius: '18px' }, s.ui || {});
      state.settings = Object.assign({ bandsEnabled: true, passPercent: 50, bands: DEFAULT_BANDS.map(b=>({...b})) }, s.settings || {});
      state.classes.forEach(c => {
        c.students = Array.isArray(c.students) ? c.students : [];
        c.students.forEach(st => { st.marks = st.marks || {}; st.phone = st.phone || ''; });
        if(!c.comps || !c.comps.length) c.comps = SCHEME[c.year] ? JSON.parse(JSON.stringify(SCHEME[c.year].comps)) : [];
        if(!c.createdBy) c.createdBy = 'admin';
      });
    }
  } catch(e) { console.error("Load error", e); }
}

let saveTimeout;
function save() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    try {
      const json = JSON.stringify(state);
      if (json.length > 4 * 1024 * 1024) console.warn('Storage approaching quota:', (json.length / 1024 / 1024).toFixed(2), 'MB');
      localStorage.setItem(STORE_KEY, json);
    } catch(e) {
      console.error("Save error", e);
      try { toast('⚠️ Could not save — storage full.'); } catch(_) {}
    }
  }, 300);
}
window.addEventListener('beforeunload', () => {
  if (saveTimeout && !window._noSave) {
    clearTimeout(saveTimeout);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
  }
});

function logAction(action, details) {
  const s = getSession(); if(!s) return;
  state.auditLog.unshift({ time: new Date().toLocaleString(), user: s.username, action, details });
  if (state.auditLog.length > 100) state.auditLog.pop();
  save();
}
function getVisibleClasses() {
  const s = getSession(); if (!s) return [];
  if (s.role === 'admin') return state.classes;
  return state.classes.filter(c => c.createdBy === s.username);
}
function activeClass() { return getVisibleClasses().find(c => c.id === state.activeClassId) || null; }

/* =========================================================
   HELPERS
   ========================================================= */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmt(v) { return (v===null || v===undefined || v==='' || isNaN(v)) ? '—' : String(parseFloat(Number(v).toFixed(2))); }
function isAbsent(v) { return v === 'AB'; }
function hasMark(v) { return v === 'AB' || (v !== '' && v !== null && v !== undefined && !isNaN(v)); }
function roundMarks(v) {
  if(state.roundMode === '0.5') return Math.round(v*2)/2;
  if(state.roundMode === '1') return Math.round(v);
  return Math.round(v*100)/100;
}
function assignRanks(arr){ let r=0, prev=null; arr.forEach((x,i)=>{ if(x.total!==prev){ r=i+1; prev=x.total; } x.rank=r; }); }

const activeToasts = [];
function repositionToasts() { activeToasts.forEach((t, i) => { t.style.bottom = (24 + i * 58) + 'px'; }); }
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast toast-enter';
  t.innerHTML = '<span>🔔</span><span>' + esc(msg) + '</span>';
  document.body.appendChild(t);
  activeToasts.push(t);
  repositionToasts();
  setTimeout(()=> {
    t.style.opacity = '0';
    setTimeout(()=>{
      const idx = activeToasts.indexOf(t);
      if (idx > -1) activeToasts.splice(idx, 1);
      t.remove();
      repositionToasts();
    }, 300);
  }, 2500);
}

const PRINT_CSS = `body{font-family:Arial,sans-serif;padding:20px;color:#000}.print-form h2{text-align:center;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;font-size:18px}.print-form h3{text-align:center;margin-top:0;font-size:14px;font-weight:normal;margin-bottom:20px}.print-form table{width:100%;border-collapse:collapse;margin-bottom:20px}.print-form th,.print-form td{border:1px solid #000;padding:6px;text-align:center;font-size:12px}.print-form th{background:#f0f0f0}.print-form .text-left{text-align:left}@media print{@page{margin:15mm}}`;
function openPrintWin(html) {
  const w = window.open('', '_blank');
  if (!w) { toast('Please allow pop-ups to print.'); return; }
  w.document.write(html); w.document.close();
}

function applyUI() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.style.setProperty('--brand-main', state.ui.brandColor);
  const c = state.ui.brandColor;
  const r = parseInt(c.slice(1,3),16) * 0.85, g = parseInt(c.slice(3,5),16) * 0.85, b = parseInt(c.slice(5,7),16) * 0.85;
  const hover = `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
  document.documentElement.style.setProperty('--brand-main-hover', hover);
  document.documentElement.style.setProperty('--brand-gradient', `linear-gradient(135deg, ${c} 0%, ${hover} 100%)`);
  document.documentElement.style.setProperty('--btn-radius', state.ui.btnRadius);
  document.documentElement.style.setProperty('--card-radius', state.ui.cardRadius);
  document.documentElement.setAttribute('data-btn-shape', state.ui.btnRadius === '999px' ? 'pill' : state.ui.btnRadius === '0px' ? 'sharp' : 'rounded');
}
function toggleTheme() { state.theme = state.theme === 'dark' ? 'light' : 'dark'; applyUI(); save(); }
function togglePasswordVisibility() { const p = document.getElementById('loginPass'); p.type = p.type === 'password' ? 'text' : 'password'; }
function toggleMobileSidebar() {
  const sb = document.getElementById('sidebar'), bd = document.getElementById('sidebarBackdrop');
  const open = sb.classList.toggle('open');
  bd.classList.toggle('show', open);
}
function openModal(title, bodyHtml) {
  document.getElementById('modalTitle').innerHTML = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('globalModal').classList.add('show');
}
function closeModal() { document.getElementById('globalModal').classList.remove('show'); }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* =========================================================
   UNDO / REDO
   ========================================================= */
const undoStack = []; const redoStack = []; const MAX_UNDO = 30;
let focusSnapshots = {};

function pushUndo(op) {
  undoStack.push(op);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;
}
function applyUndoOp(op, direction) {
  const c = state.classes.find(x => x.id === op.classId);
  if (!c) return;
  op.changes.forEach(ch => {
    const s = c.students.find(x => x.id === ch.studentId);
    if (!s) return;
    const val = direction === 'undo' ? ch.old : ch.new;
    if (val === '' || val === null || val === undefined) delete s.marks[ch.key];
    else s.marks[ch.key] = val;
  });
  save();
  renderAll();
}
function undo() {
  const op = undoStack.pop();
  if (!op) { toast('Nothing to undo'); return; }
  applyUndoOp(op, 'undo');
  redoStack.push(op);
  toast('↶ Undo: ' + op.label);
}
function redo() {
  const op = redoStack.pop();
  if (!op) { toast('Nothing to redo'); return; }
  applyUndoOp(op, 'redo');
  undoStack.push(op);
  toast('↷ Redo: ' + op.label);
}
document.addEventListener('keydown', (e) => {
  if (state.view !== 'entry') return;
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if (((e.ctrlKey || e.metaKey) && e.key === 'y') || ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'z')) { e.preventDefault(); redo(); }
});

/* =========================================================
   AUTH FLOW
   ========================================================= */
function attemptLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const found = getUsers().find(x => x.username === u && x.password === p);
  if(found) {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username: found.username, role: found.role }));
    showApp();
  } else {
    const err = document.getElementById('loginError');
    err.textContent = 'Invalid username or password.';
    err.style.display = 'block';
  }
}
function logout() {
  if(!confirm('Log out of Tamil?')) return;
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}
function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
  load(); applyUI(); applyPermissions(); nav('dashboard');
}

/* =========================================================
   AVATAR
   ========================================================= */
function triggerAvatarUpload() { document.getElementById('avatarUploadInput').click(); }
function handleAvatarUpload(event) {
  const file = event.target.files[0]; if (!file) return;
  const sess = getSession(); if (!sess) { toast('Session expired.'); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const min = Math.min(img.width, img.height);
      const sx = (img.width - min) / 2, sy = (img.height - min) / 2;
      ctx.drawImage(img, sx, sy, min, min, 0, 0, 64, 64);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      const users = getUsers();
      const u = users.find(x => x.username === sess.username);
      if (u) { u.avatar = dataUrl; saveUsers(users); applyPermissions(); toast('Profile picture updated ✅'); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}
function applyPermissions() {
  const s = getSession(); const user = currentUser();
  const info = document.getElementById('userInfo');
  if(s && info && user) {

/* =========================================================
   CALCULATION ENGINE
   ========================================================= */
function getClassComps(c) {
  if(c && c.comps && Array.isArray(c.comps) && c.comps.length > 0) return c.comps;
  return SCHEME[c.year] ? SCHEME[c.year].comps : [];
}
function findBand(pctVal) {
  if(!state.settings.bandsEnabled) return null;
  for(const b of state.settings.bands) if(pctVal >= b.min && pctVal <= b.max) return b;
  let best = null;
  for(const b of state.settings.bands) if(pctVal >= b.min && (!best || b.min > best.min)) best = b;
  return best;
}
function compInternal(cp, raw) {
  if(isAbsent(raw)) return 0;
  if(!hasMark(raw)) return null;
  const n = Math.min(Math.max(Number(raw),0), cp.rawMax);
  if(!cp.conv) return roundMarks(n);
  let p = n / cp.rawMax * 100;
  if(state.settings.bandsEnabled) { const b = findBand(p); if(b) p = b.val; }
  return roundMarks(p / 100 * cp.max);
}
function calc(cls, st) {
  const comps = getClassComps(cls);
  const res = { comps:{}, internal:0, filled:0, complete:false };
  let sum = 0, filled = 0;
  comps.forEach(cp => {
    const v = compInternal(cp, st.marks[cp.key]);
    res.comps[cp.key] = v;
    if(v !== null) { sum += v; filled++; }
  });
  res.filled = filled;
  res.complete = (filled === comps.length);
  res.internal = Math.round(sum * 100) / 100;
  return res;
}
function compStats(cls, cp) {
  let appeared=0, pass=0, fail=0;
  cls.students.forEach(s => {
    const raw = s.marks[cp.key];
    if(!hasMark(raw)) return;
    appeared++;
    if(isAbsent(raw)) { fail++; return; }
    if(Number(raw)/cp.rawMax*100 >= state.settings.passPercent) pass++; else fail++;
  });
  return { appeared, pass, fail, passPct: appeared ? (pass/appeared*100) : 0 };
}

function openStudentModal(cid, sid) {
  const c = state.classes.find(x => x.id === cid); if (!c) return;
  const s = c.students.find(x => x.id === sid); if (!s) return;
  const comps = getClassComps(c);
  const r = calc(c, s);
  const maxInternal = getInternalMax(c);
  const threshold = (state.settings.passPercent / 100) * maxInternal;
  const isPass = r.complete && r.internal >= threshold;

  const compRows = comps.map(cp => {
    const raw = s.marks[cp.key];
    const val = isAbsent(raw) ? 'AB' : (hasMark(raw) ? fmt(raw) : '—');
    const conv = r.comps[cp.key] == null ? '—' : fmt(r.comps[cp.key]);
    const pct = hasMark(raw) && !isAbsent(raw) ? ((Number(raw)/cp.rawMax)*100).toFixed(1) + '%' : '—';
    return `<tr><td><b>${esc(cp.label)}</b></td><td class="num">${val} / ${cp.rawMax}</td><td class="num">${pct}</td><td class="num">${conv} / ${cp.max}</td></tr>`;
  }).join('');

  const status = !r.complete ? '<span class="badge badge-incomplete">Incomplete</span>' : isPass ? '<span class="badge badge-pass">PASS</span>' : '<span class="badge badge-fail">FAIL</span>';

  const body = `
    <div style="display:flex; gap:16px; align-items:center; margin-bottom:20px;">
      <div style="width:56px; height:56px; border-radius:16px; background:var(--brand-gradient); color:#fff; display:grid; place-items:center; font-size:22px; font-weight:800;">${esc(s.name[0] || '?').toUpperCase()}</div>
      <div style="flex:1; min-width:0;">
        <div style="font-weight:800; font-size:17px;">${esc(s.name)}</div>
        <div class="hint">${esc(s.reg)} ${s.phone ? ' · ' + esc(s.phone) : ''}</div>
      </div>
      ${status}
    </div>
    <div class="table-wrap" style="max-height:none;"><table><thead><tr><th>Component</th><th>Raw</th><th>%</th><th>Converted</th></tr></thead><tbody>${compRows}</tbody></table></div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; padding-top:18px; border-top:1px solid var(--border-color); gap:12px; flex-wrap:wrap;">
      <div style="font-size:14px;"><b>Total Internal:</b> <span style="font-size:20px; color:var(--brand-main); font-family:Outfit; font-weight:800;">${fmt(r.internal)}</span> <span class="hint">/ ${maxInternal}</span></div>
      <button class="btn btn-whatsapp" onclick="shareWhatsApp('${cid}','${sid}')">💬 Share</button>

  openModal('Student Details', body);

function getChartCategories(year, comps) {

  ];

  return cats.filter(cat => cat.comps.length > 0);

function renderCategoryBarChart(c, category, comps) {
  const catComps = category.comps.map(k=>comps.find(x=>x.key===k)).filter(Boolean);
  if(!catComps.length) return '<div class="hint">No components</div>';
  const data = catComps.map(cp=>{ const st = compStats(c, cp); return { label: cp.label, passPct: st.passPct, pass: st.pass, appeared: st.appeared }; });
  const W = 300, H = 150, PAD_L = 32, PAD_R = 10, PAD_T = 25, PAD_B = 40;
  const innerW = W - PAD_L - PAD_R, innerH = H - PAD_T - PAD_B, gap = 18;
  const computedBarW = data.length > 0 ? (innerW - gap*(data.length-1)) / data.length : innerW;
  const barW = Math.min(42, computedBarW);
  const totalBarW = barW * data.length + gap * (data.length - 1);
  const startX = PAD_L + (innerW - totalBarW) / 2;
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">`;
  for(let p=0; p<=100; p+=25){
    const y = PAD_T + innerH - (p/100)*innerH;
    svg += `<line x1="${PAD_L}" y1="${y}" x2="${W-PAD_R}" y2="${y}" stroke="var(--border-color)" stroke-width="1" stroke-dasharray="2 3"/>`;
    svg += `<text x="${PAD_L-5}" y="${y+3}" text-anchor="end" font-size="8" fill="var(--text-muted)">${p}%</text>`;
  }
  data.forEach((d,i)=>{
    const x = startX + i*(barW+gap), h = (d.passPct/100)*innerH, y = PAD_T + innerH - h;
    const color = d.appeared === 0 ? 'var(--border-color)' : d.passPct >= 60 ? 'var(--ok)' : d.passPct >= 40 ? 'var(--warn)' : 'var(--bad)';
    svg += `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(h,2)}" fill="${color}" rx="6" opacity="0.92"><title>${esc(d.label)}: ${d.passPct.toFixed(0)}% (${d.pass}/${d.appeared})</title></rect>`;
    if(d.appeared > 0) svg += `<text x="${x+barW/2}" y="${y-7}" text-anchor="middle" font-size="10" font-weight="800" fill="var(--text-main)">${d.passPct.toFixed(0)}%</text>`;
    svg += `<text x="${x+barW/2}" y="${H-PAD_B+15}" text-anchor="middle" font-size="9.5" fill="var(--text-main)" font-weight="700">${esc(d.label)}</text>`;
    svg += `<text x="${x+barW/2}" y="${H-PAD_B+26}" text-anchor="middle" font-size="8.5" fill="var(--text-muted)">${d.pass}/${d.appeared}</text>`;
  });
  svg += `<line x1="${PAD_L}" y1="${PAD_T+innerH}" x2="${W-PAD_R}" y2="${PAD_T+innerH}" stroke="var(--text-muted)" stroke-width="1"/></svg>`;
  return svg;
}
function renderCategoryCharts(c, comps) {
  const cats = getChartCategories(c.year, comps);
  return `<div class="chart-grid">${cats.map(cat=>`<div class="chart-box"><div class="chart-title">${cat.icon} ${esc(cat.label)}</div>${renderCategoryBarChart(c, cat, comps)}</div>`).join('')}</div>`;
}
function renderPieChart(c) {
  if(!c.students.length) return '<div class="hint">No students yet.</div>';
  const threshold = (state.settings.passPercent/100)*getInternalMax(c);
  let pass=0, fail=0, incomplete=0;
  c.students.forEach(s=>{ const r = calc(c, s); if(!r.complete){ incomplete++; return; } if(r.internal >= threshold) pass++; else fail++; });
  const total = c.students.length, R = 78, CX = 100, CY = 100, STROKE = 36, C = 2*Math.PI*R;
  const segs = []; if(pass>0) segs.push({count:pass, color:'var(--ok)'}); if(fail>0) segs.push({count:fail, color:'var(--bad)'}); if(incomplete>0) segs.push({count:incomplete, color:'var(--border-strong)'});
  let offset = 0, svg = `<svg viewBox="0 0 200 200" style="width:170px;height:170px; flex-shrink:0;">`;
  segs.forEach(seg=>{ const len = (seg.count/total)*C; svg += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${seg.color}" stroke-width="${STROKE}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${CX} ${CY})"/>`; offset += len; });
  const passPct = (pass + fail) ? ((pass/(pass+fail))*100).toFixed(0) : '0';
  svg += `<text x="${CX}" y="${CY-2}" text-anchor="middle" font-size="26" font-weight="800" fill="var(--text-main)" font-family="Outfit">${passPct}%</text>`;
  svg += `<text x="${CX}" y="${CY+18}" text-anchor="middle" font-size="11" fill="var(--text-muted)" font-weight="600">Pass Rate</text></svg>`;
  const legend = [{label:'Pass', count:pass, color:'var(--ok)'}, {label:'Fail', count:fail, color:'var(--bad)'}, {label:'Incomplete', count:incomplete, color:'var(--border-strong)'}].filter(x=>x.count>0).map(x=>`<div style="display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:6px;"><span style="width:12px; height:12px; border-radius:4px; background:${x.color};"></span><span>${x.label}: <b>${x.count}</b> (${((x.count/total)*100).toFixed(0)}%)</span></div>`).join('');
  return `<div style="display:flex; align-items:center; gap:20px; justify-content:center; padding:10px;">${svg}<div>${legend}</div></div>`;
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function renderDashboardPassFail(c, comps) {
  if(!c || !c.students.length) return '';
  const tabs = [{ key: 'overall', label: 'Overall Internal' }];
  const ciaComps = comps.filter(x => x.conv);
  if (ciaComps.length >= 1) tabs.push({ key: 'cia', label: 'CIA Combined' });
  comps.forEach(cp => { if (cp.key !== 'cia1' && cp.key !== 'cia2' && !cp.label.toLowerCase().includes('test')) tabs.push({ key: cp.key, label: cp.label }); });
  if (!tabs.some(t => t.key === state.dashboardPassComp)) state.dashboardPassComp = 'overall';
  const activeComp = state.dashboardPassComp || 'overall';

  let passCount = 0, failCount = 0, studentList = [];
  const maxInternal = getInternalMax(c);

  if (activeComp === 'overall') {
    const passMark = (state.settings.passPercent / 100) * maxInternal;
    c.students.forEach(s => { const r = calc(c, s); if (!r.complete) return; const isPass = r.internal >= passMark; if (isPass) passCount++; else failCount++; studentList.push({ s, val: r.internal, max: maxInternal, isPass }); });
  } else if (activeComp === 'cia') {
    const maxCia = ciaComps.reduce((acc, cp) => acc + cp.max, 0);
    const passMark = (state.settings.passPercent / 100) * maxCia;
    c.students.forEach(s => {
      let ciaSum = 0, hasCia = false;
      ciaComps.forEach(cp => { if (hasMark(s.marks[cp.key])) { ciaSum += compInternal(cp, s.marks[cp.key]); hasCia = true; } });
      if (hasCia) { const isPass = ciaSum >= passMark; if (isPass) passCount++; else failCount++; studentList.push({ s, val: ciaSum, max: maxCia, isPass }); }
    });
  } else {
    const cp = comps.find(x => x.key === activeComp);
    if(cp) c.students.forEach(s => {
      const raw = s.marks[cp.key]; if (!hasMark(raw)) return;
      const pct = isAbsent(raw) ? 0 : Number(raw) / cp.rawMax * 100; const isPass = pct >= state.settings.passPercent;
      if (isPass) passCount++; else failCount++; studentList.push({ s, val: isAbsent(raw) ? 'AB' : Number(raw), max: cp.rawMax, isPass });
    });
  }

  let displayList = studentList;
  if (state.dashboardShowFailed) displayList = studentList.filter(item => !item.isPass);

  const totalAppeared = passCount + failCount; const passPct = totalAppeared ? (passCount / totalAppeared * 100) : 0;
  const tabHtml = tabs.map(t => `<button class="btn btn-sm ${activeComp === t.key ? 'btn-primary' : 'btn-outline'}" onclick="state.dashboardPassComp='${t.key}'; state.dashboardShowFailed=false; save(); renderDashboard();" style="border-radius:999px; margin-bottom:5px;">${esc(t.label)}</button>`).join('');

  const tableRows = displayList.map((item, i) => `<tr onclick="openStudentModal('${c.id}','${item.s.id}')" style="cursor:pointer;">
    <td class="num">${i+1}</td><td>${esc(item.s.reg || '—')}</td><td><b>${esc(item.s.name)}</b></td>
    <td class="num">${item.val === 'AB' ? '<span class="badge badge-abs">AB</span>' : fmt(item.val) + ' / ' + item.max}</td>
    <td class="num"><span class="badge ${item.isPass ? 'badge-pass' : 'badge-fail'}">${item.isPass ? 'Pass' : 'Fail'}</span></td>
  </tr>`).join('');
  const printFailBtn = state.dashboardShowFailed ? `<button class="btn btn-sm btn-outline" onclick="printFailedList()">🖨️ Print Failed List</button>` : '';

  return `
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Pass / Fail Analysis</h3>
        <div class="row" style="gap:5px; align-items:center;">
          <label style="font-size:12px; font-weight:600; cursor:pointer; margin-right:10px;">
            <input type="checkbox" ${state.dashboardShowFailed?'checked':''} onchange="state.dashboardShowFailed=this.checked; save(); renderDashboard();" style="width:auto;"> Only Failed
          </label>
          ${printFailBtn}${tabHtml}
        </div>
      </div>
      <div class="kpi-grid" style="margin-bottom:16px;">
        <div class="kpi-box"><div class="kpi-icon green">✅</div><div class="kpi-info"><div class="label">Passed</div><div class="value">${passCount}</div></div></div>
        <div class="kpi-box"><div class="kpi-icon red">❌</div><div class="kpi-info"><div class="label">Failed</div><div class="value">${failCount}</div></div></div>
        <div class="kpi-box"><div class="kpi-icon blue">🎯</div><div class="kpi-info"><div class="label">Pass %</div><div class="value">${passPct.toFixed(1)}<small>%</small></div></div></div>
      </div>
      <div class="table-wrap" style="max-height: 300px; overflow-y: auto;"><table><thead><tr><th>#</th><th>Reg No</th><th>Name</th><th>Mark</th><th>Status</th></tr></thead><tbody>${tableRows || '<tr><td colspan="5" style="text-align:center;">No data available</td></tr>'}</tbody></table></div>
    </div>`;
}
function printFailedList() {
  const c = activeClass(); if(!c) return;
  const passMark = (state.settings.passPercent / 100) * getInternalMax(c);
  const failed = c.students.map(s => { const r = calc(c, s); return { s, r }; }).filter(x => x.r.complete && x.r.internal < passMark);

function parseStudentLine(line) {
  line = line.replace(/^\uFEFF/, '').trim(); if (!line) return null;
  let reg, name, phone = '';
  if (/[\t,;|]/.test(line)) {
    const parts = (line.includes('\t') ? line.split('\t') : parseCSVLine(line.replace(/[;|]/g, ','))).map(x => x.trim());
    reg = parts[0]; name = parts[1]; phone = parts[2] || '';
  } else {
    const t = line.split(/\s+/); if (t.length < 2) return null;
    reg = t[0];
    if (t.length >= 3 && /^\+?[\d-]{10,15}$/.test(t[t.length - 1])) { phone = t[t.length - 1]; name = t.slice(1, -1).join(' '); }
    else name = t.slice(1).join(' ');
  }
  if (!reg || !name) return null;
  return { reg: reg.trim(), name: name.replace(/\s+/g, ' ').trim(), phone: String(phone).replace(/[\s-]/g, '') };
}
function addStudentsFromText(c, text) {
  const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  if (lines.length && /^\W*(reg|register|s\.?\s*no|sno|sl)/i.test(lines[0]) && /name/i.test(lines[0])) lines.shift();
  const seen = new Set(c.students.map(x => String(x.reg).toLowerCase()));
  let added = 0, dup = 0, bad = 0;
  lines.forEach(l => {
    const st = parseStudentLine(l);
    if (!st) { bad++; return; }
    const k = st.reg.toLowerCase();
    if (seen.has(k)) { dup++; return; }
    seen.add(k);
    c.students.push({ id: uid(), reg: st.reg, name: st.name, phone: st.phone, marks: {} });
    added++;
  });
  return { added, dup, bad };
}
function studentSummary(r) { return `Added ${r.added}` + (r.dup ? ` · ${r.dup} dup skipped` : '') + (r.bad ? ` · ${r.bad} invalid` : ''); }
function bulkAdd(cid) {

  save(); renderAll(); toast(studentSummary(r) + ' ✅');
}
function parseCSVLine(line) {
  const out = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) { if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; } else if (ch === '"') inQ = false; else cur += ch; }
    else { if (ch === '"') inQ = true; else if (ch === ',') { out.push(cur.trim()); cur = ''; } else cur += ch; }
  }
  out.push(cur.trim()); return out;
}
function importStudentsCSV(event) {

  };
  reader.readAsText(file);
}

function onCompBlur(el) {

function onCompInput(el) {

    const _rows = [...document.querySelectorAll('#view-entry tbody tr')].filter(t => t.style.display !== 'none');
    const _nx = _rows.slice(_rows.indexOf(tr) + 1).map(t => t.querySelector('input[data-key]:not([disabled])')).find(Boolean);
    if (_nx) { _nx.focus(); _nx.select(); }

}
function toggleAbsent(sid, key, isChecked) {

function onCompKey(e, el) {

  }

  const inputs = visibleRows.map(tr => tr.querySelector('input[data-key]:not([disabled])')).filter(Boolean);

function nextComp() {

function quickFillBlanks() {

  if (val === 'AB') num = 'AB';
  else { const n = Number(val); if (isNaN(n) || n < 0 || n > cp.rawMax) { toast(`Value must be 0–${cp.rawMax} or AB`); return; } num = n; }
  if (!confirm(`Fill ${c.students.filter(s => !hasMark(s.marks[cp.key])).length} blank students with "${num}"?`)) return;
  const changes = [];
  c.students.forEach(s => {

function clearComponentMarks() {
  const c = activeClass(); if (!c) return;
  const cp = getClassComps(c).find(x => x.key === state.activeComp); if (!cp) return;
  const withMarks = c.students.filter(s => hasMark(s.marks[cp.key]));
  if (!withMarks.length) { toast('No marks to clear'); return; }
  if (!confirm(`Clear all ${withMarks.length} marks for "${cp.label}"?`)) return;

/* =========================================================
   ANALYTICS
   ========================================================= */
function renderStats() {
  const el = document.getElementById('view-stats');
  const c = activeClass();
  if(!c) { el.innerHTML = '<div class="card">Select a class.</div>'; return; }
  const comps = getClassComps(c);
  if (!comps.length) { el.innerHTML = '<div class="card">No components configured.</div>'; return; }

  let cp = comps.find(x => x.key === state.statsComp);
  if (!cp) { cp = comps[0]; state.statsComp = cp.key; }

  const maxInternal = getInternalMax(c);
  const threshold = (state.settings.passPercent / 100) * maxInternal;
  const cpData = getTestAnalysisData(c, cp.key);

  let overallAppeared = 0, overallPassed = 0, overallDist = [0,0,0,0,0,0];
  let overallSumInternal = 0, overallAvgCount = 0;
  c.students.forEach(s => {
    const r = calc(c, s);
    if (r.complete) {
      overallAppeared++;
      if (r.internal >= threshold) overallPassed++;
      const pct = (r.internal / maxInternal) * 100;
      if      (pct >= 80) overallDist[0]++;
      else if (pct >= 70) overallDist[1]++;
      else if (pct >= 60) overallDist[2]++;
      else if (pct >= 50) overallDist[3]++;
      else if (pct >= 40) overallDist[4]++;
      else                overallDist[5]++;
      overallSumInternal += r.internal;
      overallAvgCount++;
    }
  });
  const overallPassPct = overallAppeared ? (overallPassed / overallAppeared * 100) : 0;
  const overallAvg     = overallAvgCount   ? (overallSumInternal / overallAvgCount) : 0;
  const incompleteCount = c.students.length - overallAppeared;
  const cpNotEntered = c.students.length - cpData.appeared - cpData.absent;

  let cpAvgSum = 0, cpAvgCount = 0;
  c.students.forEach(s => {
    const raw = s.marks[cp.key];
    if (hasMark(raw) && !isAbsent(raw)) { cpAvgSum += (Number(raw)/cp.rawMax)*100; cpAvgCount++; }
  });
  const cpAvgPct = cpAvgCount ? (cpAvgSum/cpAvgCount) : 0;

  const distLabels = ['80-100', '70-79', '60-69', '50-59', '40-49', '0-39'];

    return `<div style="display:flex; flex-direction:column; gap:10px;">

        return `<div style="display:flex; align-items:center; gap:10px;">

        </div>`;
      }).join('')}

          <span style="color:var(--bad); font-weight:700;">✗ ${st.fail}</span>

function getTestAnalysisData(c, cpKey) {
  const cp = getClassComps(c).find(x => x.key === cpKey);
  if(!cp) return { strength: c.students.length, appeared: 0, absent: 0, passed: 0, passPct: '0.00', dist: [0,0,0,0,0,0] };
  let appeared = 0, absent = 0, passed = 0, dist = [0,0,0,0,0,0];
  c.students.forEach(s => {
    const raw = s.marks[cp.key];
    if (isAbsent(raw)) absent++;
    else if (hasMark(raw)) {
      appeared++;
      const pct = (Number(raw) / cp.rawMax) * 100;
      if (pct >= state.settings.passPercent) passed++;
      if (pct >= 80) dist[0]++; else if (pct >= 70) dist[1]++; else if (pct >= 60) dist[2]++; else if (pct >= 50) dist[3]++; else if (pct >= 40) dist[4]++; else dist[5]++;
    }
  });
  return { strength: c.students.length, appeared, absent, passed, passPct: appeared ? (passed / appeared * 100).toFixed(2) : '0.00', dist };
}

function changePassword() {
  const cur = document.getElementById('curPass').value;
  const nw = document.getElementById('newPass2').value;

  if (!cur || !nw) { toast('All fields required'); return; }

  const s = getSession(); if (!s) return;
  const users = getUsers();
  const u = users.find(x => x.username === s.username);
  if (!u || u.password !== cur) { toast('Current password incorrect'); return; }
  u.password = nw; saveUsers(users);
  logAction('Password Changed', `Password updated for ${s.username}`);

function updateBand(i, field, val) { const v = (val === '' || isNaN(val)) ? 0 : Number(val); const b = state.settings.bands[i]; b[field] = v; if (b.min > b.max) { if (field === 'min') b.max = b.min; else b.min = b.max; } save(); renderSettings(); }

function removeUser(i) { if(!confirm('Remove user?')) return; const users = getUsers(); users.splice(i, 1); saveUsers(users); renderAll(); }
function backup() { const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'tamil_backup.json'; a.click(); }
function restore(input) {
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data || !Array.isArray(data.classes)) { alert('Invalid backup file'); return; }
      for (const cls of data.classes) { if (!cls || typeof cls !== 'object' || !Array.isArray(cls.students) || !Array.isArray(cls.comps)) throw new Error('invalid class'); cls.students.forEach(st => { if (!st.marks) st.marks = {}; }); }
      if (data.settings && !Array.isArray(data.settings.bands)) throw new Error('invalid bands');
      if(!confirm('Restore overwrites current data. Continue?')) return;
      state.classes = data.classes;
      if (data.settings && Array.isArray(data.settings.bands)) state.settings = data.settings;
      if (data.ui && data.ui.brandColor) state.ui = data.ui;
      if (data.theme) state.theme = data.theme;
      if (Array.isArray(data.auditLog)) state.auditLog = data.auditLog;
      save(); toast('Backup restored ✅'); setTimeout(() => location.reload(), 1000);
    } catch(err) { alert('Invalid file: ' + (err.message || 'parse error')); }
    input.value = '';
  };
  r.readAsText(f);
}

        </div>
      </div>
      <div class="row mb-2">
        <select id="bulkMode" style="flex:1; max-width:160px;" onchange="toggleBulkMode()"><option value="single">Single Component</option><option value="full">Full Sheet (All)</option></select>
        <select id="bulkFormat" style="flex:1; max-width:200px;"><option value="reg">Reg No + Mark</option><option value="sno">S.No + Mark</option><option value="markonly">Mark Only</option></select>
        <select id="bulkComp" style="flex:1; max-width:200px;">${compOpts}</select>
      </div>
      <div id="bulkHint" class="hint mb-2">Format: RegNo, Mark — comma, space or tab separated. Use AB for absent.</div>
      <textarea id="bulkData" rows="8" placeholder="21CS001, 45&#10;21CS002, AB"></textarea>
      <div class="row mt-2"><button class="btn btn-outline" onclick="parseBulk()">👁️ Preview</button><button class="btn btn-primary" id="btnApplyBulk" onclick="applyBulk()" disabled>✓ Apply</button></div>
    </div>
    <div id="bulkPreviewWrap"></div>`;
  toggleBulkMode();
}
function toggleBulkMode() {
  const mode = document.getElementById('bulkMode').value;
  document.getElementById('bulkComp').style.display = mode === 'single' ? 'block' : 'none';
  const hint = document.getElementById('bulkHint'), formatSel = document.getElementById('bulkFormat');
  if(mode === 'full') {
    formatSel.value = 'reg'; formatSel.disabled = true;
    const c = activeClass(), comps = getClassComps(c);
    hint.innerHTML = `<b>Full Sheet Format:</b> RegNo, ${comps.map(cp=>cp.label).join(', ')}<br>Leave blank cells empty; header row auto-skipped.`;
  } else {
    formatSel.disabled = false;
    hint.innerHTML = `Format: <b>RegNo, Mark</b> — comma, space or tab separated. Use <b>AB</b> for absent.`;
  }
}
function downloadTemplate() {
  const c = activeClass(); if(!c) return;
  const mode = document.getElementById('bulkMode').value, comps = getClassComps(c);
  let csv = mode === 'single' ? "RegNo,Mark\n21CS001,45\n21CS002,AB\n" : "RegNo," + comps.map(cp=>csvEscape(cp.label)).join(",") + "\n";
  if(mode === 'full') c.students.slice(0, 3).forEach(s => { csv += s.reg + "," + comps.map(()=>"").join(",") + "\n"; });
  const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = c.name + '_bulk_template.csv'; a.click();
}
function importBulkMarksFile(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) { const ta = document.getElementById('bulkData'); if (ta) ta.value = e.target.result; event.target.value = ''; parseBulk(); };
  reader.readAsText(file);
}
function parseBulk() {
  const c = activeClass(); const raw = document.getElementById('bulkData').value;
  if(!raw.trim()) { toast("Paste data first"); return; }
  const lines = raw.split('\n').map(l => l.replace(/\r$/, '')).filter(l => l.trim());
  const mode = document.getElementById('bulkMode').value, format = document.getElementById('bulkFormat').value;
  const comps = getClassComps(c), compKey = document.getElementById('bulkComp').value;
  bulkPreviewData = []; let okCount = 0;
  let startIdx = 0;
  if (lines.length && /^\W*(reg|register|s\.?\s*no|sno|sl)/i.test(lines[0].trim())) { if (mode === 'full' || /name/i.test(lines[0]) || lines[0].toLowerCase().includes('mark')) startIdx = 1; }
  for (let li = startIdx; li < lines.length; li++) {
    const line = lines[li];
    let parts;
    if (line.includes('\t')) parts = line.split('\t').map(x => x.trim());
    else if (line.includes(',')) parts = parseCSVLine(line);
    else if (line.includes(';') || line.includes('|')) parts = parseCSVLine(line.replace(/[;|]/g, ','));
    else parts = line.trim().split(/\s+/);
    const filteredParts = parts.filter(s => s !== '');
    if (filteredParts.length === 0) continue;
    let reg = '', name = '', student = null, markVal = null;
    if (mode === 'full') {
      if (format !== 'reg') { bulkPreviewData.push({ reg: filteredParts[0] || '?', name: '—', status: 'err', msg: 'Full sheet requires Reg format' }); continue; }
      reg = (parts[0] || '').trim();
      student = c.students.find(s => s.reg.toLowerCase() === reg.toLowerCase());
      if (!student) { bulkPreviewData.push({ reg: reg || 'Unknown', name: '—', status: 'err', msg: 'Not matched' }); continue; }
      const marks = {};
      comps.forEach((cp, i) => { const rawVal = (parts[i + 1] || '').trim(); if (!rawVal) return; const val = rawVal.toUpperCase(); if (val === 'AB') { marks[cp.key] = 'AB'; return; } const m = Number(val); if (!isNaN(m) && m >= 0 && m <= cp.rawMax) marks[cp.key] = m; });
      if (Object.keys(marks).length === 0) bulkPreviewData.push({ reg, name: student.name, status: 'err', msg: 'No valid marks' });
      else { bulkPreviewData.push({ reg, name: student.name, status: 'ok', marks, student }); okCount++; }
    } else {
      if (format === 'reg') { reg = filteredParts[0]; markVal = filteredParts.length > 1 ? filteredParts[1].toUpperCase() : null; student = c.students.find(s => s.reg.toLowerCase() === reg.toLowerCase()); }
      else if (format === 'sno') { const sno = parseInt(filteredParts[0], 10); markVal = filteredParts.length > 1 ? filteredParts[1].toUpperCase() : null; student = c.students[sno - 1]; if (student) { reg = student.reg; name = student.name; } }
      else { markVal = filteredParts[0].toUpperCase(); student = c.students[li - startIdx]; if (student) { reg = student.reg; name = student.name; } }
      if (!student) { bulkPreviewData.push({ reg: reg || 'Unknown', name: name || '—', status: 'err', msg: 'Not matched' }); continue; }
      const cp = comps.find(x => x.key === compKey);
      if (!cp) { bulkPreviewData.push({ reg, name: student.name, status: 'err', msg: 'Component not found' }); continue; }
      if (markVal == null || markVal === '') { bulkPreviewData.push({ reg, name: student.name, status: 'err', msg: 'Missing mark' }); continue; }
      if (markVal === 'AB') { bulkPreviewData.push({ reg, name: student.name, status: 'ok', mark: 'AB', cp, student }); okCount++; }
      else { const n = Number(markVal); if (isNaN(n)) bulkPreviewData.push({ reg, name: student.name, status: 'err', msg: 'Invalid' }); else if (n < 0 || n > cp.rawMax) bulkPreviewData.push({ reg, name: student.name, status: 'warn', msg: `Range (${cp.rawMax})`, mark: n, cp, student }); else { bulkPreviewData.push({ reg, name: student.name, status: 'ok', mark: n, cp, student }); okCount++; } }
    }
  }
  const wrap = document.getElementById('bulkPreviewWrap');
  if(bulkPreviewData.length === 0) { wrap.innerHTML = '<div class="card" style="text-align:center; color:var(--bad);">No data parsed.</div>'; document.getElementById('btnApplyBulk').disabled = true; return; }
  let tblHtml;
  if (mode === 'single') tblHtml = `<table class="preview-tbl"><thead><tr><th>#</th><th>Reg No</th><th>Name</th><th>Mark</th><th>Status</th></tr></thead><tbody>${bulkPreviewData.map((d, i) => `<tr class="${d.status}"><td>${i+1}</td><td>${esc(d.reg)}</td><td>${d.name ? esc(d.name) : '—'}</td><td>${d.mark !== undefined ? d.mark : '—'}</td><td>${d.status === 'ok' ? '✓' : (d.status === 'warn' ? '⚠️ ' : '❌ ') + d.msg}</td></tr>`).join('')}</tbody></table>`;
  else tblHtml = `<table class="preview-tbl"><thead><tr><th>#</th><th>Reg No</th><th>Name</th>${comps.map(cp => `<th>${esc(cp.label)}</th>`).join('')}<th>Status</th></tr></thead><tbody>${bulkPreviewData.map((d, i) => `<tr class="${d.status}"><td>${i+1}</td><td>${esc(d.reg)}</td><td>${d.name ? esc(d.name) : '—'}</td>${comps.map(cp => `<td>${d.marks && d.marks[cp.key] !== undefined ? d.marks[cp.key] : '—'}</td>`).join('')}<td>${d.status === 'ok' ? '✓' : '❌ ' + d.msg}</td></tr>`).join('')}</tbody></table>`;
  wrap.innerHTML = `<div class="card"><div class="card-header"><h3 class="card-title">Preview (${okCount} valid · ${bulkPreviewData.length - okCount} skipped)</h3></div><div class="table-wrap" style="max-height:340px; overflow-y:auto;">${tblHtml}</div></div>`;
  document.getElementById('btnApplyBulk').disabled = (okCount === 0);
}
function applyBulk() {
  const c = activeClass(); if(!c) return;
  const okItems = bulkPreviewData.filter(d => d.status === 'ok');
  if (!okItems.length) return;
  if (!confirm(`Apply ${okItems.length} marks to "${c.name}"? Overwrites existing.`)) return;
  let count = 0;
  okItems.forEach(d => {
    const student = d.student || c.students.find(s => s.reg.toLowerCase() === d.reg.toLowerCase()); if (!student) return;
    if (d.cp) student.marks[d.cp.key] = d.mark;
    else if (d.marks) Object.assign(student.marks, d.marks);
    count++;
  });
  logAction('Bulk Upload', `Updated ${count} marks in ${c.name}`);
  save(); renderAll(); toast(`${count} students updated ✅`); bulkPreviewData = []; renderBulk();
}

/* =========================================================
   RENDER ALL & INIT
   ========================================================= */
function renderTopSelector() {
  const sel = document.getElementById('globalClassSel'); const visibleClasses = getVisibleClasses();
  if(!visibleClasses.length) { sel.innerHTML = '<option>No classes</option>'; sel.disabled = true; return; }
  sel.disabled = false;
  if(!visibleClasses.some(c => c.id === state.activeClassId)) state.activeClassId = visibleClasses[0].id;
  sel.innerHTML = visibleClasses.map(c => `<option value="${c.id}" ${c.id===state.activeClassId?'selected':''}>${esc(c.name)}</option>`).join('');
}
function renderAll() {
  applyUI(); renderTopSelector();
  if(state.view === 'dashboard') renderDashboard();
  if(state.view === 'classes') renderClasses();
  if(state.view === 'entry') renderEntry();
  if(state.view === 'bulk') renderBulk();
  if(state.view === 'stats') renderStats();
  if(state.view === 'merit') renderMerit();
  if(state.view === 'test_analysis') renderTestAnalysis();
  if(state.view === 'print') renderPrint();
  if(state.view === 'settings') renderSettings();
  if(state.view === 'audit') renderAuditLog();
}

seedUsers(); load(); applyUI();
if(sessionStorage.getItem(SESSION_KEY)) { showApp(); } else { document.getElementById('loginScreen').style.display = 'flex'; }
</script>
