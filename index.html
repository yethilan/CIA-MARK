<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamil — Internal Marks Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --brand-main: #e53935;
  --brand-main-hover: #d32f2f;
  --active-text: var(--brand-main);

  --bg-body: #f5f6fa;
  --bg-panel: #ffffff;
  --bg-sidebar: #ffffff;

  --text-main: #0f172a;
  --text-muted: #64748b;

  --border-color: #e6e9f0;
  --border-strong: #d4dae5;
  --hover-bg: #f2f4f8;
  --active-bg: color-mix(in srgb, var(--brand-main) 10%, transparent);

  --ok: #16a34a;   --ok-bg: #e7f7ee;
  --bad: #dc2626;  --bad-bg: #fdecec;
  --warn: #ea580c; --warn-bg: #fff2e6;
  --blue: #2563eb; --blue-bg: #e9f0fe;

  --card-radius: 20px;
  --btn-radius: 12px;

  --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
  --shadow-md: 0 10px 30px -12px rgba(15,23,42,0.18), 0 3px 10px rgba(15,23,42,0.04);
  --shadow-lg: 0 24px 60px -20px rgba(15,23,42,0.28);
  --shadow-brand: 0 10px 24px -10px color-mix(in srgb, var(--brand-main) 55%, transparent);
  --ring: 0 0 0 4px color-mix(in srgb, var(--brand-main) 18%, transparent);
}

[data-theme="dark"] {
  --bg-body: #0a0e17;
  --bg-panel: #111827;
  --bg-sidebar: #0d131f;
  --text-main: #e5ecf5;
  --text-muted: #94a3b8;
  --border-color: #1e293b;
  --border-strong: #2b3a4f;
  --hover-bg: #1a2334;
  --active-bg: color-mix(in srgb, var(--brand-main) 20%, transparent);

  --ok: #4ade80;   --ok-bg: rgba(74,222,128,0.14);
  --bad: #f87171;  --bad-bg: rgba(248,113,113,0.14);
  --warn: #fb923c; --warn-bg: rgba(251,146,60,0.14);
  --blue: #60a5fa; --blue-bg: rgba(96,165,250,0.14);

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 12px 30px -12px rgba(0,0,0,0.7);
  --shadow-lg: 0 30px 70px -20px rgba(0,0,0,0.85);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background-color: var(--bg-body);
  color: var(--text-main);
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.3s ease, color 0.3s ease;
}
h1, h2, h3, h4, h5 { font-family: 'Outfit', 'Inter', sans-serif; letter-spacing: -0.02em; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 999px;
  border: 2px solid var(--bg-body);
}
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ===== LOGIN ===== */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 12% 18%, color-mix(in srgb, var(--brand-main) 24%, transparent) 0%, transparent 42%),
    radial-gradient(circle at 88% 8%, color-mix(in srgb, #6366f1 20%, transparent) 0%, transparent 40%),
    radial-gradient(circle at 82% 92%, color-mix(in srgb, #f59e0b 16%, transparent) 0%, transparent 45%),
    var(--bg-body);
}
.login-card {
  position: relative;
  background: color-mix(in srgb, var(--bg-panel) 82%, transparent);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid color-mix(in srgb, var(--border-color) 60%, transparent);
  border-radius: 26px;
  padding: 46px 40px 36px;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow-lg);
  animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(22px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}
.login-logo {
  text-align: center;
  font-family: 'Outfit', sans-serif;
  font-size: 38px;
  font-weight: 800;
  letter-spacing: 3px;
  background: linear-gradient(135deg, var(--brand-main), color-mix(in srgb, var(--brand-main) 45%, #ff8a8a));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
  line-height: 1.1;
}
.login-subtitle {
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 30px;
}
.login-card input {
  width: 100%;
  padding: 14px 16px;
  margin-bottom: 14px;
  border: 1px solid var(--border-color);
  border-radius: 14px;
  font-size: 14px;
  font-family: inherit;
  background: var(--bg-body);
  color: var(--text-main);
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}
.login-card input:focus {
  outline: none;
  border-color: var(--brand-main);
  background: var(--bg-panel);
  box-shadow: var(--ring);
}
.login-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--brand-main), var(--brand-main-hover));
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.3px;
  cursor: pointer;
  box-shadow: var(--shadow-brand);
  transition: transform 0.15s, filter 0.2s, box-shadow 0.2s;
  font-family: inherit;
}
.login-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.login-btn:active { transform: translateY(0); filter: brightness(0.98); }
.login-error {
  color: var(--bad);
  font-size: 13px;
  text-align: center;
  margin-bottom: 10px;
  display: none;
  font-weight: 600;
}
.password-wrapper { position: relative; }
.toggle-password {
  position: absolute;
  right: 14px;
  top: 14px;
  cursor: pointer;
  font-size: 16px;
  color: var(--text-muted);
  transition: color 0.2s;
}
.toggle-password:hover { color: var(--text-main); }

/* ===== APP SHELL ===== */
.app-container { display: none; flex-direction: column; height: 100vh; }

.topbar {
  height: 64px;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  z-index: 100;
  position: relative;
  background:
    radial-gradient(circle at 20% -60%, rgba(255,255,255,0.28), transparent 55%),
    linear-gradient(135deg, var(--brand-main), var(--brand-main-hover));
  box-shadow: 0 6px 24px -10px color-mix(in srgb, var(--brand-main) 60%, transparent);
}
.topbar-left { display: flex; align-items: center; gap: 18px; }
.hamburger {
  display: none;
  font-size: 22px;
  cursor: pointer;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  align-items: center;
  justify-content: center;
}
.hamburger:hover { background: rgba(255,255,255,0.16); }

.topbar-logo {
  font-family: 'Outfit', sans-serif;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 1.5px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar-logo-icon {
  background: #fff;
  color: var(--brand-main);
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 800;
  box-shadow: 0 6px 16px -6px rgba(0,0,0,0.35);
}
.topbar-search { position: relative; width: 320px; z-index: 110; }
.topbar-search input {
  width: 100%;
  padding: 10px 14px 10px 40px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.18);
  color: #fff;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: background 0.2s, border-color 0.2s;
}
.topbar-search input::placeholder { color: rgba(255,255,255,0.78); }
.topbar-search input:focus {
  background: rgba(255,255,255,0.28);
  border-color: rgba(255,255,255,0.45);
}
.topbar-search .search-icon {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(255,255,255,0.8);
  font-size: 13px;
  pointer-events: none;
}
.topbar-search-results {
  position: absolute;
  top: 48px;
  left: 0;
  width: 320px;
  background: var(--bg-panel);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  max-height: 320px;
  overflow-y: auto;
  display: none;
  z-index: 200;
  padding: 6px;
}
.topbar-search-results.show { display: block; }
.topbar-search-results div {
  padding: 10px 12px;
  cursor: pointer;
  border-radius: 10px;
  color: var(--text-main);
  transition: background 0.15s;
}
.topbar-search-results div:hover { background: var(--hover-bg); }

.topbar-right { display: flex; align-items: center; gap: 6px; }
.top-icon {
  font-size: 18px;
  cursor: pointer;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  transition: background 0.18s;
}
.top-icon:hover { background: rgba(255,255,255,0.16); }
.top-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #fff;
  object-fit: cover;
  border: 2px solid rgba(255,255,255,0.55);
  cursor: pointer;
  margin-left: 4px;
}

.layout-body { display: flex; flex: 1; overflow: hidden; }

.sidebar {
  width: 262px;
  background-color: var(--bg-sidebar);
  border-right: 1px solid var(--border-color);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  padding: 14px 0;
  transition: transform 0.25s ease;
}
.nav-section {
  padding: 16px 24px 8px;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 16px;
  margin: 2px 12px;
  cursor: pointer;
  color: var(--text-main);
  font-weight: 500;
  border-radius: 12px;
  transition: all 0.18s ease;
  font-size: 13.5px;
}
.nav-item:hover { background-color: var(--hover-bg); }
.nav-item.active {
  background-color: var(--active-bg);
  color: var(--active-text);
  font-weight: 700;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand-main) 18%, transparent);
}
.nav-icon {
  font-size: 18px;
  width: 24px;
  text-align: center;
  display: grid;
  place-items: center;
}
.sidebar-bottom {
  margin-top: auto;
  border-top: 1px solid var(--border-color);
  padding: 12px 0 4px;
}
.user-profile-small {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  margin: 0 12px;
  border-radius: 14px;
  background: var(--hover-bg);
}
.user-profile-small img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
.user-profile-small .info { display: flex; flex-direction: column; min-width: 0; }
.user-profile-small .name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-profile-small .role { font-size: 11px; color: var(--text-muted); text-transform: capitalize; }

.main-content {
  flex: 1;
  padding: 26px 32px 40px;
  overflow-y: auto;
  background: var(--bg-body);
}
.page-header {
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.page-title {
  font-size: 26px;
  font-weight: 800;
  margin: 0;
  color: var(--text-main);
  letter-spacing: -0.03em;
}
.page-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.view { animation: viewFade 0.35s ease; }
@keyframes viewFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ===== COMPONENTS ===== */
.card {
  background: var(--bg-panel);
  border: 1px solid var(--border-color);
  border-radius: var(--card-radius);
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.25s, border-color 0.25s;
}
.card:hover { box-shadow: var(--shadow-md); }
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  flex-wrap: wrap;
  gap: 12px;
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.kpi-box {
  background: var(--bg-panel);
  border: 1px solid var(--border-color);
  border-radius: var(--card-radius);
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s, box-shadow 0.25s;
  position: relative;
  overflow: hidden;
}
.kpi-box::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top right, color-mix(in srgb, var(--brand-main) 6%, transparent), transparent 62%);
  pointer-events: none;
}
.kpi-box:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.kpi-icon {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-size: 22px;
  flex-shrink: 0;
}
.kpi-icon.blue   { background: var(--blue-bg); color: var(--blue); }
.kpi-icon.green  { background: var(--ok-bg);   color: var(--ok); }
.kpi-icon.red    { background: var(--bad-bg);  color: var(--bad); }
.kpi-icon.orange { background: var(--warn-bg); color: var(--warn); }
.kpi-info .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.6px; }
.kpi-info .value { font-size: 24px; font-weight: 800; color: var(--text-main); font-family: 'Outfit', sans-serif; }

input[type="text"], input[type="number"], input[type="password"], select, textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border-color);
  border-radius: var(--btn-radius);
  background: var(--bg-panel);
  color: var(--text-main);
  font-size: 13.5px;
  font-family: inherit;
  transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
}
/* FIX #8a: cap input radii so pill mode doesn't break form controls */
input[type="text"], input[type="number"], input[type="password"], select {
  border-radius: min(var(--btn-radius), 16px);
}
textarea {
  border-radius: min(var(--btn-radius), 20px);
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--brand-main);
  box-shadow: var(--ring);
}

.btn {
  padding: 10px 18px;
  border: 1px solid transparent;
  border-radius: var(--btn-radius);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-family: inherit;
  white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--brand-main), var(--brand-main-hover));
  color: #fff;
  box-shadow: var(--shadow-brand);
}
.btn-primary:hover { filter: brightness(1.07); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); filter: brightness(0.98); }
.btn-outline {
  background: var(--bg-panel);
  border-color: var(--border-color);
  color: var(--text-main);
}
.btn-outline:hover { background: var(--hover-bg); border-color: var(--border-strong); }
.btn-danger {
  background: var(--bad-bg);
  color: var(--bad);
  border: 1px solid transparent;
}
.btn-danger:hover { background: color-mix(in srgb, var(--bad) 18%, transparent); }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-whatsapp {
  background: linear-gradient(135deg, #25D366, #128C7E);
  color: #fff;
  border: none;
}
.btn-whatsapp:hover { filter: brightness(1.05); transform: translateY(-1px); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.table-wrap {
  overflow-x: auto;
  border-radius: 14px;
  border: 1px solid var(--border-color);
}
table { width: 100%; border-collapse: collapse; }
th, td {
  padding: 13px 16px;
  text-align: left;
  border-bottom: 1px solid var(--border-color);
  font-size: 13px;
}
th {
  background: var(--hover-bg);
  color: var(--text-muted);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 10.5px;
  letter-spacing: 0.8px;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background 0.15s; }
tbody tr:hover td { background: var(--hover-bg); }
.num { font-variant-numeric: tabular-nums; }

.entry-tbl { border: none; }
.entry-tbl input[type="text"] {
  padding: 8px 10px;
  font-size: 14px;
  text-align: center;
  font-weight: 700;
  width: 84px;
  border-radius: 10px;
  border: 1px solid var(--border-color);
  transition: all 0.18s;
}
.entry-tbl input.empty { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.entry-tbl input.invalid-mark { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.entry-tbl input:focus { box-shadow: var(--ring); }
.entry-tbl input:disabled { background: var(--hover-bg); cursor: not-allowed; opacity: 0.7; }
.entry-tbl td.conv-cell { font-weight: 800; color: var(--brand-main); text-align: center; }
.entry-tbl td.total-cell { font-weight: 800; color: var(--text-main); text-align: center; background: var(--hover-bg); }
.entry-tbl tr.filled td:first-child { box-shadow: inset 3px 0 0 var(--ok); }
.ab-label {
  font-size: 11px;
  color: var(--bad);
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-top: 6px;
}
.ab-label input { width: auto; margin: 0; cursor: pointer; }

.tabs {
  display: flex;
  gap: 4px;
  padding: 5px;
  background: var(--hover-bg);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  margin-bottom: 20px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 9px 16px;
  cursor: pointer;
  font-weight: 600;
  color: var(--text-muted);
  border-radius: 10px;
  white-space: nowrap;
  transition: all 0.18s;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
}
.tab:hover { color: var(--text-main); background: color-mix(in srgb, var(--bg-panel) 55%, transparent); }
.tab.active {
  color: var(--brand-main);
  background: var(--bg-panel);
  box-shadow: var(--shadow-sm);
  font-weight: 700;
}

.badge {
  padding: 4px 11px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  letter-spacing: 0.2px;
}
.badge-pass { background: var(--ok-bg); color: var(--ok); }
.badge-fail { background: var(--bad-bg); color: var(--bad); }
.badge-abs  { background: var(--hover-bg); color: var(--text-muted); }
.band-chip {
  background: var(--hover-bg);
  border: 1px solid var(--border-color);
  padding: 2px 7px;
  border-radius: 6px;
  font-size: 11px;
  margin-right: 4px;
  display: inline-block;
}

.chart-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 16px;
  margin-top: 10px;
}
.chart-box {
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 18px;
  background: var(--bg-panel);
}
.chart-title { font-weight: 700; font-size: 13px; margin-bottom: 10px; color: var(--text-main); }
.chart-svg { width: 100%; height: auto; display: block; }

.hint { font-size: 12px; color: var(--text-muted); }
.text-green { color: var(--ok); }
.text-red   { color: var(--bad); }
.mt-2 { margin-top: 10px; }
.mb-2 { margin-bottom: 10px; }
.divider { height: 1px; background: var(--border-color); margin: 18px 0; }

.color-presets { display: flex; gap: 10px; flex-wrap: wrap; }
.color-btn {
  width: 38px; height: 38px; border-radius: 12px; cursor: pointer;
  border: 2px solid transparent; transition: 0.2s; position: relative;
}
.color-btn:hover { transform: scale(1.08); }
.color-btn.active { border-color: var(--text-main); box-shadow: 0 0 0 2px var(--bg-panel) inset; }
.shape-presets { display: flex; gap: 10px; flex-wrap: wrap; }
.shape-btn {
  padding: 8px 18px; border: 1px solid var(--border-color); cursor: pointer;
  background: var(--bg-panel); font-weight: 600; font-size: 12px;
  transition: 0.2s; font-family: inherit; color: var(--text-main);
}
.shape-btn.active { border-color: var(--brand-main); color: var(--brand-main); background: var(--active-bg); }

.band-tbl input { padding: 6px; text-align: center; }

.preview-tbl tr.ok td  { background: color-mix(in srgb, var(--ok) 10%, transparent); }
.preview-tbl tr.err td { background: color-mix(in srgb, var(--bad) 10%, transparent); }
.preview-tbl tr.warn td { background: color-mix(in srgb, var(--warn) 10%, transparent); }

.search-bar-container { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.search-bar-container input {
  flex: 1; padding: 11px 18px; border-radius: 999px;
  border: 1px solid var(--border-color); background: var(--bg-body);
}
.clear-search {
  cursor: pointer; font-size: 18px; color: var(--text-muted);
  padding: 5px; transition: color 0.2s;
}
.clear-search:hover { color: var(--bad); }

/* ===== PRINT PREVIEW ===== */
.print-form {
  font-family: Arial, sans-serif;
  color: #000;
  background: #fff;
  padding: 20px;
  border-radius: 12px;
}
[data-theme="dark"] .print-form {
  box-shadow: 0 0 0 1px var(--border-strong), var(--shadow-md);
}
[data-theme="dark"] .print-form::before {
  content: '🖨️ Print preview';
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #94a3b8;
  margin-bottom: 10px;
  font-family: 'Inter', sans-serif;
}
.print-form h2 {
  text-align: center; text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 5px; font-size: 18px; color: #000;
}
.print-form h3 { text-align: center; margin-top: 0; font-size: 14px; font-weight: normal; margin-bottom: 20px; color: #000; }
.print-form table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
.print-form th, .print-form td { border: 1px solid #000; padding: 6px; text-align: center; font-size: 12px; color: #000; background: transparent; }
.print-form th { background: #f0f0f0; font-weight: bold; }
.print-form .text-left { text-align: left; }
.print-form input.print-input { border: none; border-bottom: 1px dotted #000; width: auto; padding: 0 5px; background: transparent; font-family: inherit; font-size: 12px; text-align: center; }

@media print {
  body { background: #fff; }
  .sidebar, .topbar, .btn, .tabs, .no-print, .page-header, select, .print-header-actions { display: none !important; }
  .layout-body { display: block; }

  .print-form { padding: 0; border-radius: 0; box-shadow: none; }
  .print-form::before { display: none; }
  .print-form input.print-input { border-bottom: 1px solid #000; }
  .view { animation: none; }
}

/* ===== MOBILE LAYOUT ===== */

<script>
/* =========================================================
   CONSTANTS
   ========================================================= */
const SCHEME = {
  I: {
    label: '1st Year',
    comps: [
      { key:'cia1', label:'1st CIA',    rawMax:60, max:15,   conv:true  },
      { key:'cia2', label:'2nd CIA',    rawMax:60, max:15,   conv:true  },
      { key:'sem',  label:'Seminar',    rawMax:5,  max:5,    conv:false },
      { key:'asg',  label:'Assignment', rawMax:5,  max:5,    conv:false }
    ]
  },
  II: {
    label: '2nd Year',
    comps: [
      { key:'cia1', label:'Test I',    rawMax:60, max:12.5, conv:true  },
      { key:'att',  label:'Attendance', rawMax:5,  max:5,    conv:false },
      { key:'cia2', label:'Test II',    rawMax:60, max:12.5, conv:true  },
      { key:'sem',  label:'Seminar',    rawMax:5,  max:5,    conv:false },
      { key:'asg',  label:'Assignment', rawMax:5,  max:5,    conv:false }
    ]
  }
};
const DEFAULT_INTERNAL_MAX = 40;

// FIX #26: dynamic internal max per class
function getInternalMax(c) {
  const comps = getClassComps(c);
  const sum = comps.reduce((acc, cp) => acc + Number(cp.max || 0), 0);
  return sum > 0 ? sum : DEFAULT_INTERNAL_MAX;
}

const DEFAULT_BANDS = [
  { min:90,  max:100,  val:90 },
  { min:80,  max:89.99, val:80 },
  { min:70,  max:79.99, val:70 },
  { min:60,  max:69.99, val:60 },
  { min:50,  max:59.99, val:50 },
  { min:40,  max:49.99, val:40 },
  { min:0,   max:39.99, val:0  }
];

/* =========================================================
   AUTH & STATE
   ========================================================= */
const USERS_KEY = 'tamil_users_v10';
const SESSION_KEY = 'tamil_session';
const STORE_KEY = 'tamil_data_v10';
const DEFAULT_USERS = [{ username: 'admin', password: 'admin123', role: 'admin' }];

function seedUsers() {
  try {
    const existing = JSON.parse(localStorage.getItem(USERS_KEY));
    if (!existing || !Array.isArray(existing) || existing.length === 0) {
      localStorage.setItem(USERS_KEY, JSON.stringify(DEFAULT_USERS));
    }
  } catch(e) {
    localStorage.setItem(USERS_KEY, JSON.stringify(DEFAULT_USERS));
  }
}
function getUsers() {
  try {
    const users = JSON.parse(localStorage.getItem(USERS_KEY));
    if (!users || !Array.isArray(users) || users.length === 0) return DEFAULT_USERS;
    return users;
  } catch(e) { return DEFAULT_USERS; }
}
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function getSession() { try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch(e) { return null; } }
function isAdmin() { const s = getSession(); return s && s.role === 'admin'; }
function currentUser() { const s = getSession(); if(!s) return null; return getUsers().find(u => u.username === s.username) || null; }

const state = {
  roundMode: '2',
  classes: [],
  activeClassId: null,
  activeComp: null,
  expandedClassId: null,
  bulkClassId: null,
  printType: 'comp:cia1',
  statsComp: null,
  dashboardPassComp: 'overall',
  dashboardShowFailed: false,
  view: 'dashboard',
  theme: 'light',
  chartType: 'bar',
  testAnalysisDate: '',
  testAnalysisTime: '',
  testAnalysisT1: 'cia1',
  testAnalysisT2: 'cia2',
  searchQuery: '',
  auditLog: [],
  ui: { brandColor: '#e53935', btnRadius: '12px', cardRadius: '20px' },
  settings: { bandsEnabled: true, passPercent: 50, bands: DEFAULT_BANDS.map(b=>({...b})) }
};

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(s && Array.isArray(s.classes)) {
      state.classes = s.classes;
      state.roundMode = s.roundMode || '2';
      state.activeClassId = s.activeClassId || null;
      state.activeComp = s.activeComp || null;
      state.printType = s.printType || 'comp:cia1';
      state.statsComp = s.statsComp || null;
      state.dashboardPassComp = s.dashboardPassComp || 'overall';
      state.dashboardShowFailed = s.dashboardShowFailed || false;
      state.theme = s.theme || 'light';
      state.chartType = s.chartType || 'bar';
      state.testAnalysisDate = s.testAnalysisDate || '';
      state.testAnalysisTime = s.testAnalysisTime || '';
      state.testAnalysisT1 = s.testAnalysisT1 || 'cia1';
      state.testAnalysisT2 = s.testAnalysisT2 || 'cia2';
      state.auditLog = s.auditLog || [];
      state.ui = Object.assign({ brandColor: '#e53935', btnRadius: '12px', cardRadius: '20px' }, s.ui || {});
      state.settings = Object.assign({ bandsEnabled: true, passPercent: 50, bands: DEFAULT_BANDS.map(b=>({...b})) }, s.settings || {});
      if (state.ui.btnRadius === '6px') state.ui.btnRadius = '12px';
      if (state.ui.cardRadius === '8px') state.ui.cardRadius = '20px';
      state.classes.forEach(c => {
        c.students = c.students || [];
        c.students.forEach(st => { st.marks = st.marks || {}; st.phone = st.phone || ''; });
        if(!c.comps || !c.comps.length) {
          c.comps = SCHEME[c.year] ? JSON.parse(JSON.stringify(SCHEME[c.year].comps)) : [];
        }
        if(!c.createdBy) c.createdBy = 'admin';
      });
    }
  } catch(e) { console.error("Load error", e); }
}

let saveTimeout;
function save() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    try {
      const json = JSON.stringify(state);
      if (json.length > 4 * 1024 * 1024) {
        console.warn('Storage approaching quota:', (json.length / 1024 / 1024).toFixed(2), 'MB');
      }
      localStorage.setItem(STORE_KEY, json);
    } catch(e) {
      console.error("Save error", e);
      try { toast('⚠️ Could not save — storage full. Consider deleting old classes or a backup.'); } catch(_) {}
    }
  }, 300);
}

window.addEventListener('beforeunload', () => {
  if (saveTimeout) {
    clearTimeout(saveTimeout);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
  }
});

function logAction(action, details) {
  const s = getSession(); if(!s) return;
  const log = { time: new Date().toLocaleString(), user: s.username, action, details };
  state.auditLog.unshift(log);
  if (state.auditLog.length > 500) state.auditLog.pop();
  save();
}
function getVisibleClasses() {
  const s = getSession(); if (!s) return [];
  if (s.role === 'admin') return state.classes;
  return state.classes.filter(c => c.createdBy === s.username);
}
function activeClass() { return getVisibleClasses().find(c => c.id === state.activeClassId) || null; }

/* =========================================================
   HELPERS
   ========================================================= */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmt(v) { return (v===null || v===undefined || v==='' || isNaN(v)) ? '—' : String(parseFloat(Number(v).toFixed(2))); }
function isAbsent(v) { return v === 'AB'; }
function hasMark(v) { return v === 'AB' || (v !== '' && v !== null && v !== undefined && !isNaN(v)); }
function roundMarks(v) {
  if(state.roundMode === '0.5') return Math.round(v*2)/2;
  if(state.roundMode === '1') return Math.round(v);
  return Math.round(v*100)/100;
}

const activeToasts = [];
function repositionToasts() { activeToasts.forEach((t, i) => { t.style.bottom = (24 + i * 58) + 'px'; }); }
function toast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 24px;border-radius:14px;z-index:9999;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,0.4);font-family:Inter,sans-serif;font-size:13px;transition:opacity .3s, bottom .2s;max-width:90vw;';
  t.textContent = msg;
  document.body.appendChild(t);
  activeToasts.push(t);
  repositionToasts();
  setTimeout(()=> {
    t.style.opacity = '0';
    setTimeout(()=>{
      const idx = activeToasts.indexOf(t);
      if (idx > -1) activeToasts.splice(idx, 1);
      t.remove();
      repositionToasts();
    }, 300);
  }, 2500);
}

function applyUI() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.style.setProperty('--brand-main', state.ui.brandColor);
  const c = state.ui.brandColor;
  const r = parseInt(c.slice(1,3),16) * 0.85;
  const g = parseInt(c.slice(3,5),16) * 0.85;
  const b = parseInt(c.slice(5,7),16) * 0.85;
  document.documentElement.style.setProperty('--brand-main-hover', `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`);
  document.documentElement.style.setProperty('--btn-radius', state.ui.btnRadius);
  document.documentElement.style.setProperty('--card-radius', state.ui.cardRadius);
  // FIX #8c: pill-shape attribute for shape-scoped styles
  document.documentElement.setAttribute('data-btn-shape',
    state.ui.btnRadius === '999px' ? 'pill' :
    state.ui.btnRadius === '0px' ? 'sharp' : 'rounded');
}
function toggleTheme() { state.theme = state.theme === 'dark' ? 'light' : 'dark'; applyUI(); save(); }
function togglePasswordVisibility() {
  const p = document.getElementById('loginPass');
  p.type = p.type === 'password' ? 'text' : 'password';
}

function toggleMobileSidebar() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebarBackdrop');
  const open = sb.classList.toggle('open');
  bd.classList.toggle('show', open);
}

/* =========================================================
   AUTH FLOW
   ========================================================= */
function attemptLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const found = getUsers().find(x => x.username === u && x.password === p);
  if(found) {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username: found.username, role: found.role }));
    showApp();
  } else {
    const err = document.getElementById('loginError');
    err.textContent = 'Invalid username or password.';
    err.style.display = 'block';
  }
}
function logout() {
  if(!confirm('Log out of Tamil?')) return;
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}
function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
  load();
  applyUI();
  applyPermissions();
  renderAll();
}

/* =========================================================
   AVATAR
   ========================================================= */
function triggerAvatarUpload() { document.getElementById('avatarUploadInput').click(); }
function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const sess = getSession();
  if (!sess) { toast('Session expired. Please log in again.'); return; }

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const size = 120; canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const min = Math.min(img.width, img.height);
      const sx = (img.width - min) / 2; const sy = (img.height - min) / 2;
      ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      const users = getUsers();
      const u = users.find(x => x.username === sess.username);
      if (u) { u.avatar = dataUrl; saveUsers(users); applyPermissions(); toast('Profile picture updated ✅'); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function applyPermissions() {
  const s = getSession(); const user = currentUser();
  const info = document.getElementById('userInfo');
  if(s && info && user) {
    const avatarHtml = user.avatar ? `<img src="${user.avatar}" alt="">` : `<div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand-main),var(--brand-main-hover));color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;">${s.username[0].toUpperCase()}</div>`;
    info.innerHTML = `${avatarHtml}<div class="info"><span class="name">${esc(s.username)}</span><span class="role">${s.role}</span></div>`;
  }
  const topAv = document.getElementById('topbarAvatar');
  if(topAv && user) {

/* =========================================================
   CALCULATION ENGINE
   ========================================================= */
function getClassComps(c) {
  if(c && c.comps && Array.isArray(c.comps) && c.comps.length > 0) return c.comps;
  return SCHEME[c.year] ? SCHEME[c.year].comps : [];
}
function findBand(pctVal) {
  if(!state.settings.bandsEnabled) return null;
  for(const b of state.settings.bands) { if(pctVal >= b.min && pctVal <= b.max) return b; }
  return null;
}
function compInternal(cp, raw) {
  if(isAbsent(raw)) return 0;
  if(!hasMark(raw)) return null;
  const n = Math.min(Math.max(Number(raw),0), cp.rawMax);
  if(!cp.conv) return roundMarks(n);
  let p = n / cp.rawMax * 100;
  if(state.settings.bandsEnabled) {
    const b = findBand(p);
    if(b) p = b.val;
  }
  return roundMarks(p / 100 * cp.max);
}
function calc(cls, st) {
  const comps = getClassComps(cls);
  const res = { comps:{}, internal:0, filled:0, complete:false };
  let sum = 0, filled = 0;
  comps.forEach(cp => {
    const v = compInternal(cp, st.marks[cp.key]);
    res.comps[cp.key] = v;
    if(v !== null) { sum += v; filled++; }
  });
  res.filled = filled;
  res.complete = (filled === comps.length);
  res.internal = Math.round(sum * 100) / 100;
  return res;
}
function compStats(cls, cp) {
  let appeared=0, pass=0, fail=0;
  cls.students.forEach(s => {
    const raw = s.marks[cp.key];
    if(!hasMark(raw)) return;
    appeared++;
    if(isAbsent(raw)) { fail++; return; }
    if(Number(raw)/cp.rawMax*100 >= state.settings.passPercent) pass++; else fail++;
  });
  return { appeared, pass, fail, passPct: appeared ? (pass/appeared*100) : 0 };
}

function getChartCategories(year, comps) {
  const cats = [

    { label:'CIA / Test', comps:comps.filter(c=>c.label.toLowerCase().includes('cia') || c.label.toLowerCase().includes('test') || c.key==='cia1' || c.key==='cia2').map(c=>c.key), icon:'📊' }
  ];
  if(year === 'II') cats.push({ label:'Attendance', comps:comps.filter(c=>c.label.toLowerCase().includes('attend') || c.key==='att').map(c=>c.key), icon:'📋' });
  return cats.filter(cat => cat.comps.length > 0);
}

function renderCategoryBarChart(c, category, comps) {
  const catComps = category.comps.map(k=>comps.find(x=>x.key===k)).filter(Boolean);
  if(!catComps.length) return '<div class="hint">No components</div>';
  const data = catComps.map(cp=>{ const st = compStats(c, cp); return { label: cp.label, passPct: st.passPct, pass: st.pass, appeared: st.appeared }; });
  const W = 300, H = 140, PAD_L = 32, PAD_R = 10, PAD_T = 25, PAD_B = 34;
  const innerW = W - PAD_L - PAD_R, innerH = H - PAD_T - PAD_B, gap = 18;
  const computedBarW = data.length > 0 ? (innerW - gap*(data.length-1)) / data.length : innerW;
  const barW = Math.min(38, computedBarW);
  const totalBarW = barW * data.length + gap * (data.length - 1);
  const startX = PAD_L + (innerW - totalBarW) / 2;
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">`;
  for(let p=0; p<=100; p+=25){
    const y = PAD_T + innerH - (p/100)*innerH;
    svg += `<line x1="${PAD_L}" y1="${y}" x2="${W-PAD_R}" y2="${y}" stroke="var(--border-color)" stroke-width="1"/>`;
    svg += `<text x="${PAD_L-5}" y="${y+3}" text-anchor="end" font-size="8" fill="var(--text-muted)">${p}%</text>`;
  }
  data.forEach((d,i)=>{
    const x = startX + i*(barW+gap), h = (d.passPct/100)*innerH, y = PAD_T + innerH - h;
    const color = d.appeared === 0 ? 'var(--border-color)' : d.passPct >= 60 ? 'var(--ok)' : d.passPct >= 40 ? 'var(--warn)' : 'var(--bad)';
    svg += `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(h,2)}" fill="${color}" rx="4"/>`;
    if(d.appeared > 0) svg += `<text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="10" font-weight="800" fill="var(--text-main)">${d.passPct.toFixed(0)}%</text>`;
    svg += `<text x="${x+barW/2}" y="${H-PAD_B+14}" text-anchor="middle" font-size="9.5" fill="var(--text-main)" font-weight="700">${esc(d.label)}</text>`;
    svg += `<text x="${x+barW/2}" y="${H-PAD_B+25}" text-anchor="middle" font-size="8.5" fill="var(--text-muted)">${d.pass}/${d.appeared}</text>`;
  });
  svg += `<line x1="${PAD_L}" y1="${PAD_T+innerH}" x2="${W-PAD_R}" y2="${PAD_T+innerH}" stroke="var(--text-muted)" stroke-width="1"/>`;
  svg += `<line x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${PAD_T+innerH}" stroke="var(--text-muted)" stroke-width="1"/></svg>`;
  return svg;
}
function renderCategoryCharts(c, comps) {
  const cats = getChartCategories(c.year, comps);
  return `<div class="chart-grid">${cats.map(cat=>`<div class="chart-box"><div class="chart-title">${cat.icon} ${esc(cat.label)}</div>${renderCategoryBarChart(c, cat, comps)}</div>`).join('')}</div>`;
}
function renderPieChart(c) {
  if(!c.students.length) return '<div class="hint">No students yet.</div>';
  const threshold = (state.settings.passPercent/100)*getInternalMax(c);
  let pass=0, fail=0, incomplete=0;
  c.students.forEach(s=>{ const r = calc(c, s); if(!r.complete){ incomplete++; return; } if(r.internal >= threshold) pass++; else fail++; });
  const total = c.students.length, R = 78, CX = 100, CY = 100, STROKE = 36, C = 2*Math.PI*R;
  const segs = []; if(pass>0) segs.push({count:pass, color:'var(--ok)'}); if(fail>0) segs.push({count:fail, color:'var(--bad)'}); if(incomplete>0) segs.push({count:incomplete, color:'var(--border-strong)'});
  let offset = 0, svg = `<svg viewBox="0 0 200 200" style="width:150px;height:150px; flex-shrink:0;">`;
  segs.forEach(seg=>{ const len = (seg.count/total)*C; svg += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${seg.color}" stroke-width="${STROKE}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${CX} ${CY})"/>`; offset += len; });
  const passPct = ((pass/total)*100).toFixed(0);
  svg += `<text x="${CX}" y="${CY-2}" text-anchor="middle" font-size="26" font-weight="800" fill="var(--text-main)" font-family="Outfit">${passPct}%</text>`;
  svg += `<text x="${CX}" y="${CY+18}" text-anchor="middle" font-size="11" fill="var(--text-muted)" font-weight="600">Pass Rate</text></svg>`;
  const legend = [{label:'Pass', count:pass, color:'var(--ok)'}, {label:'Fail', count:fail, color:'var(--bad)'}, {label:'Incomplete', count:incomplete, color:'var(--border-strong)'}].filter(x=>x.count>0).map(x=>`<div style="display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:6px;"><span style="width:12px; height:12px; border-radius:4px; background:${x.color};"></span><span>${x.label}: <b>${x.count}</b> (${((x.count/total)*100).toFixed(0)}%)</span></div>`).join('');
  return `<div style="display:flex; align-items:center; gap:20px; justify-content:center; padding:10px;">${svg}<div>${legend}</div></div>`;
}

   ========================================================= */
function renderDashboardPassFail(c, comps) {
  if(!c || !c.students.length) return '';
  const tabs = [{ key: 'overall', label: 'Overall Internal' }, { key: 'cia', label: 'CIA / Test Combined' }];
  comps.forEach(cp => { if (cp.key !== 'cia1' && cp.key !== 'cia2' && !cp.label.toLowerCase().includes('test')) tabs.push({ key: cp.key, label: cp.label }); });

  // FIX #2: reset stale filter so it doesn't silently show 0/0/0%
  if (!tabs.some(t => t.key === state.dashboardPassComp)) state.dashboardPassComp = 'overall';
  const activeComp = state.dashboardPassComp || 'overall';

  let passCount = 0, failCount = 0, studentList = [];
  const maxInternal = getInternalMax(c);

  if (activeComp === 'overall') {
    const passMark = (state.settings.passPercent / 100) * maxInternal;
    c.students.forEach(s => { const r = calc(c, s); const isPass = r.internal >= passMark; if (isPass) passCount++; else failCount++; studentList.push({ s, val: r.internal, max: maxInternal, isPass }); });
  } else if (activeComp === 'cia') {
    const ciaComps = comps.filter(x => x.conv);
    const maxCia = ciaComps.reduce((acc, cp) => acc + cp.max, 0);
    const passMark = (state.settings.passPercent / 100) * maxCia;
    c.students.forEach(s => {
      let ciaSum = 0, hasCia = false;
      ciaComps.forEach(cp => { if (hasMark(s.marks[cp.key])) { ciaSum += compInternal(cp, s.marks[cp.key]); hasCia = true; } });
      if (hasCia) { const isPass = ciaSum >= passMark; if (isPass) passCount++; else failCount++; studentList.push({ s, val: ciaSum, max: maxCia, isPass }); }
    });
  } else {
    const cp = comps.find(x => x.key === activeComp);
    if(cp) {
      c.students.forEach(s => {
        const raw = s.marks[cp.key]; if (!hasMark(raw)) return;
        const pct = isAbsent(raw) ? 0 : Number(raw) / cp.rawMax * 100; const isPass = pct >= state.settings.passPercent;
        if (isPass) passCount++; else failCount++; studentList.push({ s, val: isAbsent(raw) ? 'AB' : Number(raw), max: cp.rawMax, isPass });
      });
    }
  }

  let displayList = studentList;
  if (state.dashboardShowFailed) displayList = studentList.filter(item => !item.isPass);

  const totalAppeared = passCount + failCount; const passPct = totalAppeared ? (passCount / totalAppeared * 100) : 0;
  const tabHtml = tabs.map(t => `<button class="btn btn-sm ${activeComp === t.key ? 'btn-primary' : 'btn-outline'}" onclick="state.dashboardPassComp='${t.key}'; state.dashboardShowFailed=false; save(); renderDashboard();" style="border-radius:999px; margin-bottom:5px;">${t.label}</button>`).join('');

  const tableRows = displayList.map((item, i) => `<tr><td class="num">${i+1}</td><td>${esc(item.s.reg || '—')}</td><td>${esc(item.s.name)}</td><td class="num">${item.val === 'AB' ? '<span class="badge badge-abs">AB</span>' : fmt(item.val) + ' / ' + item.max}</td><td class="num"><span class="badge ${item.isPass ? 'badge-pass' : 'badge-fail'}">${item.isPass ? 'Pass' : 'Fail'}</span></td></tr>`).join('');
  const printFailBtn = state.dashboardShowFailed ? `<button class="btn btn-sm btn-outline" onclick="printFailedList()">🖨️ Print Failed List</button>` : '';

  return `
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Internal Pass / Fail Analysis</h3>
        <div class="row" style="gap:5px; align-items:center;">
          <label style="font-size:12px; font-weight:600; cursor:pointer; margin-right:10px;">
            <input type="checkbox" ${state.dashboardShowFailed?'checked':''} onchange="state.dashboardShowFailed=this.checked; save(); renderDashboard();" style="width:auto;"> Only Failed
          </label>
          ${printFailBtn}
          ${tabHtml}
        </div>
      </div>
      <div class="kpi-grid" style="margin-bottom:16px;">
        <div class="kpi-box"><div class="kpi-icon green">✅</div><div class="kpi-info"><div class="label">Passed</div><div class="value">${passCount}</div></div></div>
        <div class="kpi-box"><div class="kpi-icon red">❌</div><div class="kpi-info"><div class="label">Failed</div><div class="value">${failCount}</div></div></div>
        <div class="kpi-box"><div class="kpi-icon blue">🎯</div><div class="kpi-info"><div class="label">Pass %</div><div class="value">${passPct.toFixed(1)}<small>%</small></div></div></div>
      </div>
      <div class="table-wrap" style="max-height: 300px; overflow-y: auto;"><table><thead><tr><th>#</th><th>Reg No</th><th>Name</th><th>Mark</th><th>Status</th></tr></thead><tbody>${tableRows || '<tr><td colspan="5" style="text-align:center;">No data available</td></tr>'}</tbody></table></div>
    </div>`;
}

function renderDashboard() {
  const el = document.getElementById('view-dashboard');
  const c = activeClass();
  if(!getVisibleClasses().length) {
    el.innerHTML = `<div class="card" style="text-align:center; padding:48px;"><div style="font-size:44px; margin-bottom:12px;">🏫</div><h2>Welcome to Tamil</h2><p class="hint">Add a class to get started.</p><button class="btn btn-primary mt-2" onclick="nav('classes')">+ Add Class</button></div>`;

  const maxInternal = getInternalMax(c);
  const passMarkInternal = (state.settings.passPercent / 100) * maxInternal;

  c.students.forEach(s => {
    const r = calc(c, s);
    if(r.complete) fullCount++;
    if(r.filled > 0) { sumInternal += r.internal; sumCount++; }
    if(r.complete && r.internal < passMarkInternal) internalFailCount++;
  });

  const avgInternal = sumCount ? (sumInternal/sumCount) : 0;
  const chartHtml = state.chartType === 'pie' ? renderPieChart(c) : renderCategoryCharts(c, comps);
  const miniProgs = comps.map(cp => {
    const done = c.students.filter(s => hasMark(s.marks[cp.key])).length;
    const p = total ? (done/total*100) : 0;
    return `<div style="margin-bottom:12px;"><div style="display:flex; justify-content:space-between; font-size:12px; font-weight:600; margin-bottom:5px;"><span>${esc(cp.label)}</span><span>${done}/${total}</span></div><div style="height:7px; background:var(--hover-bg); border-radius:999px; overflow:hidden;"><div style="height:100%; width:${p}%; background:${done===total?'var(--ok)':'linear-gradient(90deg,var(--brand-main),var(--brand-main-hover))'}; border-radius:999px; transition:width 0.4s;"></div></div></div>`;
  }).join('');

  const sorted = [...c.students].map(s => ({s, r: calc(c, s)})).sort((a,b) => b.r.internal - a.r.internal);
  const top3 = sorted.slice(0, 3).map((item, index) => `
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px dashed var(--border-color);">
      <div style="font-size:20px; width:30px; text-align:center;">${index === 0 ? '🥇' : index === 1 ? '🥈' : '🥉'}</div>
      <div style="flex:1; min-width:0;"><b>${esc(item.s.name)}</b><br><span style="font-size:11px; color:var(--text-muted);">${esc(item.s.reg)}</span></div>
      <div style="font-weight:800; color:var(--brand-main);">${fmt(item.r.internal)} <span style="font-size:11px; color:var(--text-muted); font-weight:500;">/${maxInternal}</span></div>
    </div>
  `).join('');

  el.innerHTML = `
    <div class="kpi-grid">

function updateClassComp(cid, index, field, value) { const c = state.classes.find(x => x.id === cid); if(!c || !c.comps || !c.comps[index]) return; if(field === 'rawMax' || field === 'max') value = Number(value); if(field === 'conv') value = Boolean(value); c.comps[index][field] = value; save(); renderAll(); }
function addClassComp(cid) { const c = state.classes.find(x => x.id === cid); if(!c) return; c.comps.push({ key: uid(), label: 'New Component', rawMax: 10, max: 10, conv: false }); save(); renderAll(); }
function removeClassComp(cid, index) { const c = state.classes.find(x => x.id === cid); if(!c) return; if(!confirm('Delete this component?')) return; c.comps.splice(index, 1); save(); renderAll(); }
function addClass() {
  const name = document.getElementById('clsName').value.trim(); const year = document.getElementById('clsYear').value; const subject = document.getElementById('clsSubject').value.trim();
  if(!name) { alert('Class name is required.'); return; }

  state.classes.push(c); state.expandedClassId = c.id; if(!state.activeClassId) state.activeClassId = c.id;
  document.getElementById('clsName').value = ''; logAction('Class Created', `Added class ${name}`); save(); renderAll();
}
function delClass(id) {
  const c = state.classes.find(x => x.id === id);
  if (!c) return;
  if (!isAdmin() && c.createdBy !== getSession().username) return;
  if(!confirm(`Delete class "${c.name}"?`)) return;
  state.classes = state.classes.filter(x => x.id !== id);

function toggleBulk(id) { state.bulkClassId = (state.bulkClassId === id) ? null : id; renderAll(); }

function addStudent(cid) {

function delStudent(cid, sid) {

function bulkAdd(cid) {
  const c = state.classes.find(x => x.id === cid); if(!c) return;
  const txt = document.getElementById('bulkText_'+cid).value;
  txt.split('\n').forEach(line => {
    const parts = line.split(',').map(s=>s.trim());
    if(parts.length >= 2) c.students.push({ id: uid(), reg: parts[0], name: parts[1], phone: parts[2] || '', marks: {} });
  });
  logAction('Bulk Students Added', `Bulk added students to ${c.name}`);
  save(); renderAll();
}

function parseCSVLine(line) {
  const out = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else { cur += ch; }
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { out.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
  }
  out.push(cur.trim());
  return out;
}

function importStudentsCSV(event) {
  const file = event.target.files[0]; if(!file) return;
  const cid = event.target.dataset.classId;
  const c = state.classes.find(x => x.id === cid); if(!c) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    let count = 0;
    lines.forEach((line, index) => {
      if (index === 0 && line.toLowerCase().includes('reg')) return;
      const parts = parseCSVLine(line);
      if (parts.length >= 2 && parts[0] && parts[1]) {
        c.students.push({ id: uid(), reg: parts[0], name: parts[1], phone: parts[2] || '', marks: {} });
        count++;
      }
    });
    logAction('CSV Import', `Imported ${count} students into ${c.name}`);
    save(); renderAll();
    toast(`Imported ${count} students successfully ✅`);
    event.target.value = '';
  };
  reader.readAsText(file);
}

  const rows = displayStudents.map((s, i) => {
    const r = calc(c, s); const raw = s.marks[cp.key]; const filled = hasMark(raw); const absent = isAbsent(raw);

    if(cp.conv) cells += `<td class="conv-cell" id="cv_${s.id}">${fmt(r.comps[cp.key])}</td>`;

    return `<tr class="${filled?'filled':''}" data-sid="${s.id}">${cells}</tr>`;

function filterEntryRows(q) {
  state.searchQuery = q;
  const rows = document.querySelectorAll('#view-entry tbody tr[data-sid]');
  const lq = q.toLowerCase();
  rows.forEach(tr => {
    const reg = (tr.children[1]?.textContent || '').toLowerCase();
    const name = (tr.children[2]?.textContent || '').toLowerCase();
    tr.style.display = (!lq || reg.includes(lq) || name.includes(lq)) ? '' : 'none';
  });
  const clearBtn = document.getElementById('entrySearchClear');
  if (clearBtn) clearBtn.style.display = q ? 'inline' : 'none';
}
function clearEntrySearch() {
  state.searchQuery = '';
  const inp = document.getElementById('entrySearch');
  if (inp) { inp.value = ''; inp.focus(); }
  filterEntryRows('');
}

function onCompInput(el) {
  const c = activeClass(); if(!c) return;
  const s = c.students.find(x => x.id === el.dataset.sid); if(!s) return;
  const key = el.dataset.key;
  const max = Number(el.dataset.max);
  const val = el.value.trim().toUpperCase();
  const tr = el.closest('tr');
  const cb = tr.querySelector('input[type="checkbox"]');

  if (val === 'AB') {
    s.marks[key] = 'AB';
    el.classList.remove('invalid-mark');
    el.classList.add('empty');
    cb.checked = true;
    el.disabled = true;
  } else if (val === '') {
    s.marks[key] = '';
    el.classList.remove('invalid-mark');
    el.classList.add('empty');
    cb.checked = false;
  } else if (!isNaN(Number(val))) {
    const numVal = Number(val);
    if (numVal < 0 || numVal > max) {
      el.classList.add('invalid-mark');
      delete s.marks[key];
    } else {
      s.marks[key] = numVal;
      el.classList.remove('invalid-mark');
    }
    cb.checked = false;
  } else {
    // FIX #4: preserve AB display when invalid char typed on a pending AB state
    if (isAbsent(s.marks[key])) {
      el.value = 'AB';
      el.disabled = true;
    } else if (hasMark(s.marks[key])) {
      el.value = s.marks[key];
    } else {
      el.value = '';
    }
    return;
  }

  save();
  const cp = getClassComps(c).find(x => x.key === key);
  const r = calc(c, s);

  if (cp.conv) {
    const cvEl = document.getElementById(`cv_${s.id}`);
    if (cvEl) cvEl.textContent = fmt(r.comps[key]);
  }
  const intEl = document.getElementById(`int_${s.id}`);
  if (intEl) intEl.textContent = fmt(r.internal);

  el.classList.toggle('empty', !hasMark(s.marks[key]));
  tr.classList.toggle('filled', hasMark(s.marks[key]));
}

function toggleAbsent(sid, key, isChecked) {
  const c = activeClass(); if(!c) return;
  const s = c.students.find(x => x.id === sid); if(!s) return;
  if(isChecked) s.marks[key] = 'AB';
  else s.marks[key] = '';
  save();

  const tr = document.querySelector(`tr[data-sid="${sid}"]`);
  if (!tr) return;

  const inp = tr.querySelector('input[data-key]');
  const cp = getClassComps(c).find(x => x.key === key);
  const r = calc(c, s);

  if (isChecked) {
    inp.value = 'AB';
    inp.disabled = true;
    inp.classList.remove('empty', 'invalid-mark');
    tr.classList.add('filled');
  } else {
    inp.value = '';
    inp.disabled = false;
    inp.classList.add('empty');
    tr.classList.remove('filled');
  }

  if (cp.conv) {
    const cvEl = document.getElementById(`cv_${sid}`);
    if (cvEl) cvEl.textContent = fmt(r.comps[key]);
  }
  const intEl = document.getElementById(`int_${sid}`);
  if (intEl) intEl.textContent = fmt(r.internal);
}

function onCompKey(e, el) {
  if(e.key !== 'Enter') return; e.preventDefault();
  const inputs = Array.from(document.querySelectorAll('#view-entry input[data-key]:not([disabled])'));
  const i = inputs.indexOf(el);
  if(i > -1 && i < inputs.length - 1) {
    const n = inputs[i+1];
    n.focus(); n.select(); n.scrollIntoView({block:'center', behavior:'smooth'});
  } else {
    nextComp();
  }
}

function nextComp() {
  const c = activeClass(); if(!c) return; const comps = getClassComps(c); const idx = comps.findIndex(x => x.key === state.activeComp);
  if (idx > -1 && idx < comps.length - 1) {
    state.activeComp = comps[idx+1].key; state.searchQuery = ''; save(); renderAll();
    toast('Next component ➜ ' + comps[idx+1].label);
    setTimeout(()=>{ const el = document.querySelector('#view-entry input[data-key]'); if(el) el.focus(); }, 50);
  } else {
    toast('All marks entered ✅');
  }
}

function shareWhatsApp(cid, sid) {
  const c = state.classes.find(x => x.id === cid); if(!c) return;
  const s = c.students.find(x => x.id === sid); if(!s) return;
  const r = calc(c, s);
  const maxInternal = getInternalMax(c);

  let text = `*${c.name} - Internal Marks*\n`;
  text += `Name: ${s.name}\n`;
  text += `Reg No: ${s.reg}\n\n`;

  const comps = getClassComps(c);
  comps.forEach(cp => {
    const raw = s.marks[cp.key];
    const val = isAbsent(raw) ? 'AB' : (hasMark(raw) ? fmt(r.comps[cp.key]) : '-');
    text += `${cp.label}: ${val} / ${cp.max}\n`;
  });

  text += `\n*Total Internal: ${fmt(r.internal)} / ${maxInternal}*`;
  text += `\nStatus: ${r.internal >= ((state.settings.passPercent / 100) * maxInternal) ? 'PASS' : 'FAIL'}`;

  const phone = s.phone ? s.phone.replace(/\D/g, '') : '';
  const url = phone
    ? `https://wa.me/${phone}?text=${encodeURIComponent(text)}`
    : `https://wa.me/?text=${encodeURIComponent(text)}`;
  // FIX #7: popup-safe open (works even with popup blockers)
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function printMeritList() {
  const c = activeClass(); if(!c) return;
  const maxInternal = getInternalMax(c);
  const sorted = c.students.map(s => {
    const r = calc(c, s);
    return { s, r, total: r.internal };
  }).sort((a, b) => b.total - a.total);

  const rows = sorted.map((item, i) => {
    const isPass = item.total >= ((state.settings.passPercent / 100) * maxInternal);
    return `<tr><td>${i+1}</td><td>${item.s.reg}</td><td>${item.s.name}</td><td>${fmt(item.total)}</td><td>${isPass?'Pass':'Fail'}</td></tr>`;
  }).join('');

  const html = `
    <html><head><title>Merit List - ${esc(c.name)}</title>
    <style> body { font-family: Arial; padding: 20px; } table { width:100%; border-collapse:collapse; margin-top:20px; } th,td { border:1px solid #000; padding:8px; text-align:center; } th { background:#eee; } </style>
    </head><body>
    <h2 style="text-align:center;">${esc(c.name)} - Merit List</h2>
    <h4 style="text-align:center;">(Ranked by Internal Marks out of ${maxInternal})</h4>
    <table>
      <thead><tr><th>Rank</th><th>Reg No</th><th>Name</th><th>Total</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="display:flex; justify-content:space-between; margin-top:50px;">
      <div>Faculty In-charge</div><div>HOD</div>
    </div>
    <script>window.onload = () => { setTimeout(() => window.print(), 300); };<\/script>
    </body></html>`;
  const w = window.open('', '_blank'); w.document.write(html); w.document.close();
}

/* =========================================================
   TEST RESULT ANALYSIS
   ========================================================= */
function getTestAnalysisData(c, cpKey) {
  const cp = getClassComps(c).find(x => x.key === cpKey);
  if(!cp) return { strength: c.students.length, appeared: 0, absent: 0, passed: 0, passPct: '0.00', dist: [0,0,0,0,0,0] };

  let appeared = 0, absent = 0, passed = 0;
  let dist = [0, 0, 0, 0, 0, 0];

  c.students.forEach(s => {
    const raw = s.marks[cp.key];
    if (isAbsent(raw)) { absent++; dist[5]++; }
    else if (hasMark(raw)) {
      appeared++;
      const pct = (Number(raw) / cp.rawMax) * 100;
      if (pct >= state.settings.passPercent) passed++;
      if (pct >= 80) dist[0]++;
      else if (pct >= 70) dist[1]++;
      else if (pct >= 60) dist[2]++;
      else if (pct >= 50) dist[3]++;
      else if (pct >= 40) dist[4]++;
      else dist[5]++;
    }
  });

  return {
    strength: c.students.length,
    appeared, absent, passed,
    passPct: appeared ? (passed / appeared * 100).toFixed(2) : '0.00',
    dist
  };
}

function getExportTableHTML() {
  const c = activeClass(); if(!c) return '';
  const kind = document.getElementById('printType')?.value || state.printType;
  const comps = getClassComps(c);
  const maxInternal = getInternalMax(c);

  if(kind === 'report_card') {
    const sid = document.getElementById('rcStudentId')?.value;
    const s = c.students.find(x => x.id === sid);
    if(!s) return '<div style="text-align:center; padding:20px;">Select a student.</div>';
    const r = calc(c, s);
    let compRows = comps.map(cp => {
      const raw = s.marks[cp.key];
      const val = isAbsent(raw) ? 'AB' : (hasMark(raw) ? fmt(r.comps[cp.key]) : '-');
      return `<tr><td class="text-left">${cp.label}</td><td>${val}</td><td>${cp.max}</td></tr>`;
    }).join('');
    return `
      <div class="print-form">
        <h2>${esc(c.name)}</h2>
        <h3>Individual Report Card</h3>
        <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-size:14px;">
          <span><b>Name:</b> ${esc(s.name)}</span>
          <span><b>Reg No:</b> ${esc(s.reg)}</span>
        </div>
        <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
          <thead><tr><th class="text-left">Component</th><th>Converted Mark</th><th>Max</th></tr></thead>
          <tbody>${compRows}</tbody>
        </table>
        <div style="text-align:right; font-size:16px; margin-bottom:20px;">
          <b>Total Internal: ${fmt(r.internal)} / ${maxInternal}</b>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:50px;">
          <div>Faculty In-charge</div><div>HOD</div>
        </div>
      </div>
    `;
  }

  if(kind === 'form-outcome') {
    const getCatStats = (catKeys) => {
      let avgSum = 0, avgCount = 0, passCount = 0, totalAppeared = 0;
      c.students.forEach(s => {
        let catSum = 0, catFilled = 0;
        catKeys.forEach(k => {
          const cp = comps.find(x=>x.key===k);
          if(cp && hasMark(s.marks[k]) && !isAbsent(s.marks[k])) { catSum += (Number(s.marks[k])/cp.rawMax)*100; catFilled++; }
        });
        if(catFilled > 0) {
          avgSum += (catSum/catFilled); avgCount++;
          if((catSum/catFilled) >= state.settings.passPercent) passCount++;
          totalAppeared++;
        }
      });
      return { avg: avgCount ? (avgSum/avgCount).toFixed(2) : '0.00', passPct: totalAppeared ? (passCount/totalAppeared*100).toFixed(2) : '0.00' };
    };

    const testKeys = comps.filter(x=>x.label.toLowerCase().includes('test') || x.label.toLowerCase().includes('cia')).map(x=>x.key);
    const semKeys = comps.filter(x=>x.label.toLowerCase().includes('sem')).map(x=>x.key);
    const asgKeys = comps.filter(x=>x.label.toLowerCase().includes('assign')).map(x=>x.key);
    const attKeys = comps.filter(x=>x.label.toLowerCase().includes('attend')).map(x=>x.key);

    const testStats = getCatStats(testKeys.length ? testKeys : ['cia1']);
    const semStats = getCatStats(semKeys.length ? semKeys : ['sem']);
    const asgStats = getCatStats(asgKeys.length ? asgKeys : ['asg']);

    let attStats = { avg: '0.00', passPct: '0.00' };
    if (attKeys.length > 0) { attStats = getCatStats(attKeys); }
    else { attStats = { avg: 'N/A', passPct: 'N/A' }; }

    const boxHtml = (title, avg, pass) => `
      <div style="border: 2px solid #000; padding: 15px; margin-bottom:15px; text-align:center;">
        <h4 style="margin:0 0 10px 0; text-transform:uppercase;">${title}</h4>
        <table style="border:none; margin:0;"><tr>
          <td style="border:none; width:50%; text-align:center;"><b>Average Marks</b><br><br><div style="border:1px dashed #000; padding:20px; background:#f9f9f9; font-size:16px;">${avg}</div></td>
          <td style="border:none; width:50%; text-align:center;"><b>Pass (%)</b><br><br><div style="border:1px dashed #000; padding:20px; background:#f9f9f9; font-size:16px;">${pass}${pass !== 'N/A' ? '%' : ''}</div></td>
        </tr></table>
      </div>
    `;
    return `<div class="print-form">
      <h2>1. Outcome of the CIA</h2>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:30px;">
        <div>${boxHtml('Test', testStats.avg, testStats.passPct)}${boxHtml('Assignment', asgStats.avg, asgStats.passPct)}</div>
        <div>${boxHtml('Seminar', semStats.avg, semStats.passPct)}${boxHtml('Attendance', attStats.avg, attStats.passPct)}</div>
      </div></div>`;
  }

  if(kind === 'form-analysis') {
    const data1 = getTestAnalysisData(c, state.testAnalysisT1);
    const data2 = getTestAnalysisData(c, state.testAnalysisT2);
    return `<div class="print-form">
      <h2>INTERNAL TEST RESULT ANALYSIS</h2>
      <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-size:13px; font-weight:bold;">
        <span>Date: <span style="display:inline-block; border-bottom:1px solid #000; min-width:120px; text-align:center;">${esc(state.testAnalysisDate) || '&nbsp;'}</span></span>
        <span>Time: <span style="display:inline-block; border-bottom:1px solid #000; min-width:100px; text-align:center;">${esc(state.testAnalysisTime) || '&nbsp;'}</span></span>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:30px;">

      </div>
    </div>`;
  }

  if(kind === 'form-computation') {
    const test1 = comps.find(x=>x.label.toLowerCase().includes('test i') || x.key === 'cia1');
    const test2 = comps.find(x=>x.label.toLowerCase().includes('test ii') || x.key === 'cia2');
    const test3 = comps.find(x=>x.label.toLowerCase().includes('test iii'));
    const sem = comps.find(x=>x.label.toLowerCase().includes('sem'));
    const asg = comps.find(x=>x.label.toLowerCase().includes('assign'));
    const att = comps.find(x=>x.label.toLowerCase().includes('attend'));

    const rows = c.students.map((s, i) => {
      const r = calc(c, s);
      let absCount = 0;
      comps.forEach(cp => { if(isAbsent(s.marks[cp.key])) absCount++; });
      const attVal = att && hasMark(s.marks[att.key]) ? ((Number(s.marks[att.key])/att.rawMax)*100).toFixed(0) : '90';
      const getM = (cp) => cp ? (hasMark(s.marks[cp.key]) ? (isAbsent(s.marks[cp.key]) ? 'AB' : fmt(r.comps[cp.key])) : '-') : '-';
      const total = r.internal;
      const rounded = Math.round(total);
      const status = absCount > 2 ? 'Ab' : (total >= ((state.settings.passPercent/100)*maxInternal) ? 'P' : 'F');
      return `<tr>
        <td>${s.reg || (i+1)}</td><td>${absCount > 0 ? absCount : '-'}</td><td>${attVal}%</td>
        <td>${getM(test1)}</td><td>${getM(test2)}</td><td>${getM(test3)}</td>
        <td>${getM(sem)}</td><td>${getM(asg)}</td><td>${getM(att)}</td>
        <td style="font-weight:bold;">${total ? fmt(total) : '-'}</td>
        <td style="font-weight:bold;">${total ? rounded : '-'}</td>
        <td style="font-weight:bold; color:${status==='P'?'#2e7d32':status==='F'?'#c62828':'#777'}">${status}</td>
      </tr>`;
    }).join('');

    return `<div class="print-form">
      <h2>INTERNAL MARK COMPUTATION</h2>
      <table style="margin-top:20px;">
        <thead>
          <tr>
            <th rowspan="2">Reg. No</th><th rowspan="2">No. of Absentees</th><th rowspan="2">Overall % Attendance</th>
            <th colspan="6">Marks</th>
            <th rowspan="2">Total</th><th rowspan="2">Rounded</th><th rowspan="2">P / F / Ab</th>
          </tr>
          <tr><th>Test I</th><th>Test II</th><th>Test III</th><th>Seminar</th><th>Assignment</th><th>Attendance</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  let tableHtml = ''; let title = '';
  if(kind === 'internal') {
    title = `Internal Marks Summary (/${maxInternal})`;
    tableHtml = `<table border="1" style="width:100%; border-collapse:collapse; text-align:center; font-size:12px;">
      <tr style="background:#eee;"><th>#</th><th>Reg No</th><th>Name</th>${comps.map(cp=>`<th>${cp.label}</th>`).join('')}<th>Total</th></tr>
      ${c.students.map((s,i) => { const r = calc(c,s); return `<tr><td>${i+1}</td><td>${s.reg}</td><td style="text-align:left;">${s.name}</td>${comps.map(cp=>`<td>${isAbsent(s.marks[cp.key]) ? 'AB' : fmt(r.comps[cp.key])}</td>`).join('')}<td><b>${fmt(r.internal)}</b></td></tr>`; }).join('')}
    </table>`;
  } else {
    const key = kind.split(':')[1];
    const cp = comps.find(x=>x.key===key);
    if (!cp) {
      return `<div class="print-form"><p style="text-align:center;color:#c00;">Component not found. Please select another option.</p></div>`;
    }
    title = `${cp.label} Mark List`;
    tableHtml = `<table border="1" style="width:100%; border-collapse:collapse; text-align:center; font-size:12px;">
      <tr style="background:#eee;"><th>#</th><th>Reg No</th><th>Name</th><th>Mark</th>${cp.conv?'<th>Converted</th>':''}</tr>
      ${c.students.map((s,i) => { const r = calc(c,s); return `<tr><td>${i+1}</td><td>${s.reg}</td><td style="text-align:left;">${s.name}</td><td>${isAbsent(s.marks[key]) ? 'AB' : hasMark(s.marks[key])?fmt(s.marks[key]):'-'}</td>${cp.conv?`<td>${fmt(r.comps[key])}</td>`:''}</tr>`; }).join('')}
    </table>`;
  }

  return `<html><head><title>Print</title><style>body{font-family:Arial;} @media print { @page { margin: 15mm; } }</style></head>
  <body>
    <h2 style="text-align:center;">${esc(c.name)}</h2>
    <h4 style="text-align:center; margin-top:-10px;">${title}</h4>
    ${tableHtml}
    <div style="display:flex; justify-content:space-between; margin-top:50px;">
      <div>Faculty In-charge</div><div>HOD</div>
    </div>
  </body></html>`;
}

function doPrint() {
  const body = getExportTableHTML();
  const isFullDoc = body.trim().toLowerCase().startsWith('<html');
  let html;
  if (isFullDoc) {
    html = body.replace('</body>', '<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body>');
  } else {
    html = `<html><head><title>Print</title><style>body{font-family:Arial;padding:20px;} @media print { @page { margin: 15mm; } }</style></head><body>${body}<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`;
  }
  const w = window.open('', '_blank');
  if (!w) { toast('Please allow pop-ups to print.'); return; }
  w.document.write(html);
  w.document.close();
}

function buildExportWrapper(html, kind) {
  const isFullDoc = html.trim().toLowerCase().startsWith('<html');
  if (isFullDoc) return html;
  if (kind === 'excel') {
    return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"></head><body>${html}</body></html>`;
  }
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"></head><body>${html}</body></html>`;
}

function exportExcel() {
  const html = getExportTableHTML();
  const template = buildExportWrapper(html, 'excel');
  const blob = new Blob([template], { type: 'application/vnd.ms-excel' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = activeClass().name + '_marks.xls'; a.click();
}
function exportWord() {
  const html = getExportTableHTML();
  const template = buildExportWrapper(html, 'word');
  const blob = new Blob([template], { type: 'application/msword' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = activeClass().name + '_marks.doc'; a.click();
}
function csvEscape(v) {
  const s = String(v == null ? '' : v);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function exportCSV() {
  const c = activeClass(); if(!c) return;
  const comps = getClassComps(c);
  let csv = 'RegNo,Name,' + comps.map(cp=>csvEscape(cp.label)).join(',') + ',Internal\n';
  c.students.forEach(s => {
    const r = calc(c, s);
    const marks = comps.map(cp => isAbsent(s.marks[cp.key]) ? 'AB' : hasMark(s.marks[cp.key]) ? s.marks[cp.key] : '');
    csv += [csvEscape(s.reg), csvEscape(s.name), ...marks.map(csvEscape), r.internal].join(',') + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = c.name + '_marks.csv'; a.click();
}

function renderSettings() {
  const el = document.getElementById('view-settings');

  const s = state.settings; const u = state.ui;
  const bandRows = s.bands.map((b, i) => `<tr><td class="num">${i+1}</td><td><input type="number" step="0.01" value="${b.min}" onchange="updateBand(${i},'min',this.value)"></td><td><input type="number" step="0.01" value="${b.max}" onchange="updateBand(${i},'max',this.value)"></td><td><input type="number" step="0.01" value="${b.val}" onchange="updateBand(${i},'val',this.value)"></td><td><button class="btn btn-danger btn-sm" onclick="removeBand(${i})">✕</button></td></tr>`).join('');

  el.innerHTML = `

      <div class="mb-2"><label style="font-weight:600; font-size:12px; margin-bottom:8px; display:block;">Theme Color</label><div class="color-presets"><div class="color-btn ${u.brandColor==='#e53935'?'active':''}" style="background:#e53935" onclick="setBrandColor('#e53935')"></div><div class="color-btn ${u.brandColor==='#1e88e5'?'active':''}" style="background:#1e88e5" onclick="setBrandColor('#1e88e5')"></div><div class="color-btn ${u.brandColor==='#43a047'?'active':''}" style="background:#43a047" onclick="setBrandColor('#43a047')"></div><div class="color-btn ${u.brandColor==='#8e24aa'?'active':''}" style="background:#8e24aa" onclick="setBrandColor('#8e24aa')"></div><div class="color-btn ${u.brandColor==='#37474f'?'active':''}" style="background:#37474f" onclick="setBrandColor('#37474f')"></div></div></div>
      <div class="mb-2"><label style="font-weight:600; font-size:12px; margin-bottom:8px; display:block;">Button Shape</label><div class="shape-presets"><div class="shape-btn ${u.btnRadius==='0px'?'active':''}" style="border-radius:0px" onclick="setBtnShape('0px')">Sharp</div><div class="shape-btn ${u.btnRadius==='12px'?'active':''}" style="border-radius:12px" onclick="setBtnShape('12px')">Rounded</div><div class="shape-btn ${u.btnRadius==='999px'?'active':''}" style="border-radius:999px" onclick="setBtnShape('999px')">Pill</div></div></div>
    </div>
    <div class="card">
      <div class="card-header"><h3 class="card-title">System Settings & Conversion Bands</h3></div>
      <div class="row mb-2"><label style="flex:1;">Pass Percentage (%)</label><input type="number" value="${s.passPercent}" onchange="state.settings.passPercent=Number(this.value); save(); renderAll();" style="width:100px;"></div>
      <div class="row mb-2"><label style="flex:1;">Enable Band Conversion</label><input type="checkbox" ${s.bandsEnabled?'checked':''} onchange="state.settings.bandsEnabled=this.checked; save(); renderAll();" style="width:auto;"></div>
      <div class="divider"></div><h4 style="margin-bottom:10px; font-size:13px;">Conversion Bands (Raw % to Value)</h4>
      <div class="table-wrap"><table class="band-tbl"><thead><tr><th style="width:40px">#</th><th>Min</th><th>Max</th><th>Band Value</th><th></th></tr></thead><tbody>${bandRows}</tbody></table></div>
      <div class="row mt-2"><button class="btn btn-outline btn-sm" onclick="addBand()">+ Add Band Row</button><button class="btn btn-outline btn-sm" onclick="resetBands()">↺ Reset Defaults</button></div>
    </div>
    <div class="card">
      <div class="card-header"><h3 class="card-title">User Management</h3></div>
      <div class="hint mb-2">⚠️ Passwords are stored locally in plaintext. This is a classroom tool — do not reuse important passwords here.</div>
      <div class="table-wrap"><table><thead><tr><th>Username</th><th>Role</th><th>Action</th></tr></thead><tbody>${getUsers().map((u,i) => `<tr><td>${u.username}</td><td>${u.role}</td><td>${u.role==='admin'?'Protected':`<button class="btn btn-danger btn-sm" onclick="removeUser(${i})">Remove</button>`}</td></tr>`).join('')}</tbody></table></div>
      <div class="row mt-2"><input type="text" id="newUser" placeholder="Username" style="flex:1;"><input type="password" id="newPass" placeholder="Password" style="flex:1;"><button class="btn btn-primary" onclick="addUser()">Add User</button></div>
    </div>`;
}

function updateBand(i, field, val) { const v = (val === '' || isNaN(val)) ? 0 : Number(val); state.settings.bands[i][field] = v; save(); }
function addBand() { state.settings.bands.push({ min:0, max:0, val:0 }); save(); renderSettings(); }
function removeBand(i) { state.settings.bands.splice(i, 1); save(); renderSettings(); }
function resetBands() { if(!confirm('Reset bands to default?')) return; state.settings.bands = DEFAULT_BANDS.map(b=>({...b})); save(); renderSettings(); toast('Bands reset ✅'); }
function setBrandColor(color) { state.ui.brandColor = color; applyUI(); save(); renderSettings(); document.documentElement.style.setProperty('--active-text', color); }
function setBtnShape(radius) { state.ui.btnRadius = radius; applyUI(); save(); renderSettings(); }
function addUser() { const u = document.getElementById('newUser').value; const p = document.getElementById('newPass').value; if(!u || !p) return; const users = getUsers(); if(users.some(x=>x.username===u)) { toast('Username already exists'); return; } users.push({username:u, password:p, role:'user'}); saveUsers(users); renderAll(); }
function removeUser(i) { const users = getUsers(); users.splice(i, 1); saveUsers(users); renderAll(); }

function backup() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'tamil_backup.json'; a.click();
}

function restore(input) {
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data || !Array.isArray(data.classes)) { alert('Invalid backup file format'); return; }
      for (const cls of data.classes) {
        if (!cls || typeof cls !== 'object') throw new Error('invalid class');
        if (!Array.isArray(cls.students)) throw new Error('invalid students');
        if (!Array.isArray(cls.comps)) throw new Error('invalid comps');
      }
      if (data.settings && !Array.isArray(data.settings.bands)) throw new Error('invalid bands');
      if(!confirm('Are you sure you want to restore? This will overwrite current data.')) return;
      state.classes = data.classes;
      if (data.settings && Array.isArray(data.settings.bands)) state.settings = data.settings;
      if (data.ui && data.ui.brandColor) state.ui = data.ui;
      if (data.theme) state.theme = data.theme;
      if (Array.isArray(data.auditLog)) state.auditLog = data.auditLog;
      save();
      toast('Backup restored successfully');
      setTimeout(() => location.reload(), 1000);
    } catch(err) {
      alert('Invalid file: ' + (err.message || 'Could not parse JSON.'));
    }
    input.value = '';
  };
  r.readAsText(f);
}

function resetAll() { if(confirm('Delete all data?')) { localStorage.removeItem(STORE_KEY); location.reload(); } }

function renderAuditLog() {

      </div>
