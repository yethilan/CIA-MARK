        <table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="4" style="text-align:center;">No activities yet.</td></tr>'}</tbody>

/* =========================================================
   BULK UPLOAD
   ========================================================= */
let bulkPreviewData = [];
function renderBulk() {
  const el = document.getElementById('view-bulk'); const c = activeClass();
  if(!c) { el.innerHTML = '<div class="card">Please select a class.</div>'; return; }
  const comps = getClassComps(c); const compOpts = comps.map(cp => `<option value="${cp.key}">${cp.label} (Max ${cp.rawMax})</option>`).join('');
  el.innerHTML = `
    <div class="card">
      <div class="card-header"><h3 class="card-title">Bulk Upload Marks</h3><button class="btn btn-outline btn-sm" onclick="downloadTemplate()">⬇️ Download Template</button></div>
      <div class="row mb-2">
        <select id="bulkMode" style="flex:1; max-width:160px;" onchange="toggleBulkMode()"><option value="single">Single Component</option><option value="full">Full Sheet (All)</option></select>
        <select id="bulkFormat" style="flex:1; max-width:200px;"><option value="reg">Reg No + Mark</option><option value="sno">S.No + Mark</option><option value="markonly">Mark Only (List Order)</option></select>
        <select id="bulkComp" style="flex:1; max-width:200px;">${compOpts}</select>
      </div>
      <div id="bulkHint" class="hint mb-2">Format: <b>RegNo, Mark</b> (e.g., 21CS001, 45). Use <b>AB</b> for absent.</div>
      <textarea id="bulkData" rows="8" placeholder="21CS001, 45&#10;21CS002, AB"></textarea>
      <div class="row mt-2"><button class="btn btn-outline" onclick="parseBulk()">👁️ Preview Data</button><button class="btn btn-primary" id="btnApplyBulk" onclick="applyBulk()" disabled>✓ Apply to Class</button></div>
    </div>
    <div id="bulkPreviewWrap"></div>`;
}

function toggleBulkMode() {
  const mode = document.getElementById('bulkMode').value;
  document.getElementById('bulkComp').style.display = mode === 'single' ? 'block' : 'none';
  const hint = document.getElementById('bulkHint');
  const formatSel = document.getElementById('bulkFormat');
  if(mode === 'full') {
    formatSel.value = 'reg'; formatSel.disabled = true;
    const c = activeClass(); const comps = getClassComps(c);
    hint.innerHTML = `<b>Full Sheet Format:</b> RegNo, ${comps.map(cp=>cp.label).join(', ')}<br>Example: 21CS001, 45, AB, 42, 5, 5`;
  } else {
    formatSel.disabled = false;
    hint.innerHTML = `Format: <b>RegNo, Mark</b> (e.g., 21CS001, 45). Use <b>AB</b> for absent.`;
  }
}

function downloadTemplate() {
  const c = activeClass(); if(!c) return; const mode = document.getElementById('bulkMode').value; const comps = getClassComps(c);
  let csv = mode === 'single' ? "RegNo,Mark\n21CS001,45\n21CS002,AB\n" : "RegNo," + comps.map(cp=>csvEscape(cp.label)).join(",") + "\n";
  if(mode === 'full') { c.students.slice(0, 3).forEach(s => { csv += s.reg + "," + comps.map(()=>"").join(",") + "\n"; }); }
  const blob = new Blob([csv], {type: 'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = c.name + '_bulk_template.csv'; a.click();
}

function parseBulk() {
  const c = activeClass(); const data = document.getElementById('bulkData').value.trim();
  if(!data) { alert("Please paste some data first."); return; }
  const lines = data.split('\n').map(l => l.trim()).filter(l => l);
  const mode = document.getElementById('bulkMode').value;
  const format = document.getElementById('bulkFormat').value;
  const comps = getClassComps(c);
  const compKey = document.getElementById('bulkComp').value;
  bulkPreviewData = []; let okCount = 0;

  lines.forEach((line, index) => {
    const parts = line.split(/[\t,]+|\s{2,}/).map(s => s.trim()).filter(s => s);
    if(parts.length === 0) return;
    let reg = '', name = '', markVal = null, student = null;
    if(format === 'reg') { reg = parts[0]; markVal = parts.length > 1 ? parts[1].toUpperCase() : null; student = c.students.find(s => s.reg.toLowerCase() === reg.toLowerCase()); }
    else if(format === 'sno') { const sno = parseInt(parts[0], 10); markVal = parts.length > 1 ? parts[1].toUpperCase() : null; student = c.students[sno - 1]; if(student) { reg = student.reg; name = student.name; } }
    else if(format === 'markonly') { markVal = parts[0].toUpperCase(); student = c.students[index]; if(student) { reg = student.reg; name = student.name; } }
    if(!student) { bulkPreviewData.push({ reg: reg || 'Unknown', name: name || '—', status: 'err', msg: 'Student not matched', line }); return; }

    if(mode === 'single') {
      const cp = comps.find(x => x.key === compKey);
      if(!cp) { bulkPreviewData.push({ reg, name: student.name, status: 'err', msg: 'Component not found', line }); return; }
      // FIX #5: blank cell is "missing", not zero
      if (markVal == null || markVal === '') {
        bulkPreviewData.push({ reg, name: student.name, status: 'err', msg: 'Missing mark', line });
        return;
      }
      if(markVal === 'AB') { bulkPreviewData.push({ reg, name: student.name, status: 'ok', mark: 'AB', cp }); okCount++; }
      else {
        const n = Number(markVal);
        if(isNaN(n)) bulkPreviewData.push({ reg, name: student.name, status: 'err', msg: 'Invalid Mark', line });
        else if(n < 0 || n > cp.rawMax) bulkPreviewData.push({ reg, name: student.name, status: 'warn', msg: `Out of range (Max ${cp.rawMax})`, line, mark: n });
        else { bulkPreviewData.push({ reg, name: student.name, status: 'ok', mark: n, cp }); okCount++; }
      }
    } else {
      if(format !== 'reg') { bulkPreviewData.push({ reg, name: student.name, status: 'err', msg: 'Full sheet requires Reg No format', line }); return; }
      const marks = {};
      // FIX #6: skip blank cells so they don't become 0
      comps.forEach((cp, i) => {
        const rawVal = (parts[i+1] || '').trim();
        if (!rawVal) return;
        const val = rawVal.toUpperCase();
        if (val === 'AB') { marks[cp.key] = 'AB'; return; }
        const m = Number(val);
        if (!isNaN(m) && m >= 0 && m <= cp.rawMax) marks[cp.key] = m;
      });
      if(Object.keys(marks).length === 0) bulkPreviewData.push({ reg, name: student.name, status: 'err', msg: 'No valid marks', line });
      else { bulkPreviewData.push({ reg, name: student.name, status: 'ok', marks }); okCount++; }
    }
  });

  const wrap = document.getElementById('bulkPreviewWrap');
  if(bulkPreviewData.length === 0) { wrap.innerHTML = '<div class="card" style="text-align:center; color:var(--bad);">No valid data parsed. Check format.</div>'; document.getElementById('btnApplyBulk').disabled = true; return; }

  let tblHtml;
  if (mode === 'single') {
    tblHtml = `<table class="preview-tbl"><thead><tr><th>#</th><th>Reg No</th><th>Name</th><th>Mark</th><th>Status</th></tr></thead><tbody>${bulkPreviewData.map((d, i) => `<tr class="${d.status}"><td>${i+1}</td><td>${esc(d.reg)}</td><td>${d.name ? esc(d.name) : '—'}</td><td>${d.mark !== undefined ? d.mark : '—'}</td><td>${d.status === 'ok' ? '✓ Ready' : '❌ ' + d.msg}</td></tr>`).join('')}</tbody></table>`;
  } else {
    tblHtml = `<table class="preview-tbl"><thead><tr><th>#</th><th>Reg No</th><th>Name</th>${comps.map(cp => `<th>${esc(cp.label)}</th>`).join('')}<th>Status</th></tr></thead><tbody>${bulkPreviewData.map((d, i) => `<tr class="${d.status}"><td>${i+1}</td><td>${esc(d.reg)}</td><td>${d.name ? esc(d.name) : '—'}</td>${comps.map(cp => `<td>${d.marks && d.marks[cp.key] !== undefined ? d.marks[cp.key] : '—'}</td>`).join('')}<td>${d.status === 'ok' ? '✓ Ready' : '❌ ' + d.msg}</td></tr>`).join('')}</tbody></table>`;
  }
  wrap.innerHTML = `<div class="card"><div class="card-header"><h3 class="card-title">Preview Data (${okCount} valid)</h3></div><div class="table-wrap" style="max-height:300px; overflow-y:auto;">${tblHtml}</div></div>`;
  document.getElementById('btnApplyBulk').disabled = (okCount === 0);
}

function applyBulk() {
  const c = activeClass(); if(!c) return;
  const okItems = bulkPreviewData.filter(d => d.status === 'ok');
  if (!confirm(`Apply ${okItems.length} marks to "${c.name}"? This will overwrite existing entries.`)) return;
  let count = 0;
  okItems.forEach(d => {
    const student = c.students.find(s => s.reg.toLowerCase() === d.reg.toLowerCase()); if(!student) return;
    if(d.cp) student.marks[d.cp.key] = d.mark;
    else if(d.marks) Object.assign(student.marks, d.marks);
    count++;
  });
  logAction('Bulk Upload', `Updated ${count} marks in ${c.name}`);
  save(); renderAll(); toast(`${count} students updated successfully ✅`); bulkPreviewData = []; renderBulk();
}

}

  if(state.view === 'print') renderPrint();

  if(state.view === 'audit') renderAuditLog();
}

seedUsers();
if(sessionStorage.getItem(SESSION_KEY)) { showApp(); } else { document.getElementById('loginScreen').style.display = 'flex'; }
